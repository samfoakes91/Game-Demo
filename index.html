<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>IB Economics SL — Microeconomics: Elasticity</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a1628;color:#fff;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px}
html,body{overflow-x:hidden}
body.hub-light{background:#000;}
.hub-tile{transition:all .16s ease;}
.hub-tile:hover{box-shadow:0 4px 16px rgba(24,34,52,.10);transform:translateY(-2px);}
.hub-tile:active{transform:translateY(0);box-shadow:0 1px 4px rgba(24,34,52,.08);}
.hub-tile.sl:hover{background:#e3f4f1 !important;border-color:#0f766e !important;}
.hub-tile.hl:hover{background:#fdeedd !important;border-color:#b45309 !important;}
#app{width:100%;max-width:600px;position:relative}
/* ── Landing page (hub) keeps the wide desktop layout ── */
@media (min-width:900px){
  body.hub-light #app{max-width:1040px}
  .hub-grid{grid-template-columns:1fr 1fr 1fr !important}
  .hub-tile svg{width:118px;height:118px}
}
@media (min-width:1280px){
  body.hub-light #app{max-width:1220px}
  .hub-tile svg{width:132px;height:132px}
}
/* ── All other screens: original 600px caps, scaled up on big screens ── */
@media (min-width:700px){ body:not(.hub-light){zoom:1.15} }
@media (min-width:1100px){ body:not(.hub-light){zoom:1.3} }
@media (min-width:1600px){ body:not(.hub-light){zoom:1.45} }
/* Scoped side-by-side layout for diagram questions in "PED Along the Curve: The Regions" only */
@media (min-width:1000px){
  body.wide-q #app{max-width:980px}
  body.wide-q .game-cols{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:start}
  body.wide-q .game-cols .gpane .gwrap{margin-bottom:0}
}
@media (min-width:1350px){
  body.wide-q #app{max-width:1160px}
}
/* Side-by-side reference panel next to the lesson list, once a module is open on desktop */
@media (min-width:1000px){
  body.home-wide #app{max-width:1000px}
  .home-cols{display:grid;grid-template-columns:1fr 420px;gap:26px;align-items:start}
  .home-side{position:sticky;top:14px}
}
@media (min-width:1350px){
  body.home-wide #app{max-width:1180px}
  .home-cols{grid-template-columns:1fr 480px;gap:30px}
}
.sc{display:none}.sc.on{display:block}

.btn{border:none;cursor:pointer;border-radius:12px;font-weight:700;font-family:inherit;font-size:15px;transition:all .15s;width:100%;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.gold-btn{background:#f0b429;color:#0a1628;border-bottom:4px solid #b8820a}
.gold-btn:hover{background:#e6a817}
.gold-btn:active{transform:translateY(2px);border-bottom-width:2px}
.gold-btn:disabled{background:#1a2d50;color:#3a5078;border-bottom-color:#111f38;cursor:not-allowed;transform:none}
.map-btn{background:#fff;color:#182234;border:none;border-bottom:4px solid #c3cad6;font-size:14px;font-weight:800;cursor:pointer;padding:11px 18px;border-radius:11px;font-family:inherit;white-space:nowrap;flex-shrink:0;letter-spacing:.01em;transition:all .15s}
.crumb-seg:hover{text-decoration:underline}
.duel-icon{position:relative;width:220px;height:215px;margin:0 auto 6px;max-width:100%;}
.duel-sword{position:absolute;top:0;width:127px;height:191px;transform-origin:50% 92%;}
.duel-swordL{left:14.7px;transform:rotate(32deg);}
.duel-swordR{right:14.7px;transform:rotate(-32deg);}
[onclick="openChallengeJoinOnly()"]:hover{background:#f3effe !important;}
[onclick="openChallengeJoinOnly()"]:hover .duel-swordL{animation:duelSwivelL 1.6s cubic-bezier(.45,0,.55,1);}
[onclick="openChallengeJoinOnly()"]:hover .duel-swordR{animation:duelSwivelR 1.6s cubic-bezier(.45,0,.55,1);}
@keyframes duelSwivelL{0%{transform:rotate(32deg);}50%{transform:rotate(0deg);}100%{transform:rotate(32deg);}}
@keyframes duelSwivelR{0%{transform:rotate(-32deg);}50%{transform:rotate(0deg);}100%{transform:rotate(-32deg);}}
.duel-spark{position:absolute;top:71%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:46px;opacity:0;pointer-events:none;}
[onclick="openChallengeJoinOnly()"]:hover .duel-spark{animation:duelSpark .7s ease 1.39s;}
@keyframes duelSpark{0%{transform:translate(-50%,-50%) scale(0) rotate(0deg);opacity:0;}30%{transform:translate(-50%,-50%) scale(1.5) rotate(20deg);opacity:1;}100%{transform:translate(-50%,-50%) scale(2.1) rotate(40deg);opacity:0;}}
.map-btn:hover{background:#f2f4f8}
.map-btn:active{transform:translateY(2px);border-bottom-width:2px}
.teal-btn{background:#00c4a7;color:#0a1628;border-bottom:4px solid #009e86}
.teal-btn:hover{background:#00b398}
.teal-btn:active{transform:translateY(2px);border-bottom-width:2px}
.ghost{background:transparent;color:#7a90b8;border:1.5px solid #2a4070;margin-top:10px}
.ghost:hover{border-color:#7a90b8;color:#fff}

.opt{width:100%;text-align:left;padding:13px 16px;background:#152038;border:2px solid rgba(255,255,255,.1);color:#fff;border-radius:13px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:11px;margin-bottom:9px}
.opt:hover:not([disabled]){border-color:#f0b429;background:#1c2d4a}
.opt.sel{border-color:#f0b429;background:rgba(240,180,41,.1)}
.opt.ok{border-color:#00c4a7;background:rgba(0,196,167,.15)}
.opt.ng{border-color:#ff5555;background:rgba(255,85,85,.15)}
.opt[disabled]{cursor:not-allowed}
.olet{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#7a90b8;flex-shrink:0;min-width:28px}
.opt.sel .olet{background:rgba(240,180,41,.3);color:#f0b429}
.opt.ok .olet{background:rgba(0,196,167,.3);color:#00c4a7}
.opt.ng .olet{background:rgba(255,85,85,.3);color:#ff5555}

.chip{padding:9px 16px;background:#152038;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;margin:4px;display:inline-block}
.chip:hover:not([disabled]){border-color:#f0b429;background:#1c2d4a}
.chip.sel{border-color:#f0b429;background:rgba(240,180,41,.15);color:#f0b429}
.chip.ok{border-color:#00c4a7;background:rgba(0,196,167,.15);color:#00c4a7}
.chip.ng{border-color:#ff5555;background:rgba(255,85,85,.1);color:#ff5555}
.chip[disabled]{cursor:not-allowed}

.sopt{width:100%;text-align:left;padding:13px 16px;background:#152038;border:2px solid rgba(255,255,255,.1);color:#fff;border-radius:13px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;transition:all .12s;display:flex;align-items:center;gap:11px;margin-bottom:9px}
.sopt:hover:not([disabled]){border-color:#f0b429;background:#1c2d4a;transform:translateX(3px)}
.sopt.ok{border-color:#00c4a7;background:rgba(0,196,167,.15);transform:none}
.sopt.ng{border-color:#ff5555;background:rgba(255,85,85,.15);transform:none}
.sopt[disabled]{cursor:not-allowed}
.sdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);flex-shrink:0}
.sopt.ok .sdot{background:#00c4a7}
.sopt.ng .sdot{background:#ff5555}

.prog{height:7px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;flex:1}
.pf{height:100%;background:#f0b429;border-radius:99px;transition:width .4s}

.fb{border-radius:13px;padding:14px 18px;margin-top:12px;display:flex;align-items:flex-start;gap:13px}
.fb.ok{background:rgba(0,196,167,.12);border:1.5px solid #00c4a7}
.fb.ng{background:rgba(255,85,85,.1);border:1.5px solid #ff5555}

.sts{display:flex;gap:9px;margin-bottom:20px}
.st{flex:1;background:#152038;border-radius:13px;border:1px solid rgba(255,255,255,.08);padding:13px;text-align:center}
.sv{font-size:22px;font-weight:800;color:#f0b429}
.sl{font-size:11px;color:#7a90b8;margin-top:3px;font-weight:600}

.coin-pill{background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.3);border-radius:99px;padding:5px 12px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;flex-shrink:0}
.gold-coin::after{content:'';position:absolute;top:2px;left:4px;width:6px;height:3px;border-radius:50%;background:rgba(255,255,200,.45);transform:rotate(-30deg)}
.gold-coin-lg{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe97a,#f0b429 45%,#b8820a 80%,#7a5200 100%);box-shadow:0 6px 0 #7a5200,0 10px 28px rgba(0,0,0,.65),inset 0 3px 8px rgba(255,255,230,.65);border:3px solid #c8900a;position:relative;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#7a5200;text-shadow:0 2px 0 rgba(255,220,80,.7);margin:0 auto;animation:spinBounce .7s ease forwards}
.gold-coin-lg::after{content:'';position:absolute;top:12px;left:16px;width:24px;height:11px;border-radius:50%;background:rgba(255,255,200,.45);transform:rotate(-30deg)}

.cbox{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.2);border-radius:11px;padding:12px 16px;margin-bottom:18px}
.cbox div{font-size:14px;margin:3px 0}

.timer-ring-wrap{position:relative;width:70px;height:70px;flex-shrink:0}
.timer-ring-wrap svg{transform:rotate(-90deg)}
.timer-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;transition:color .5s}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-top:8px}
.rcircle{width:84px;height:84px;border-radius:50%;background:rgba(240,180,41,.12);border:3px solid #f0b429;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 14px}

/* Module divider label */
.mod-label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;padding:3px 10px;border-radius:99px;display:inline-block;margin-bottom:6px}
.mod-fa{background:rgba(0,196,167,.15);color:#00c4a7;border:1px solid rgba(0,196,167,.3)}
.mod-ra{background:rgba(206,130,255,.15);color:#ce82ff;border:1px solid rgba(206,130,255,.3)}
.mod-hl{background:rgba(245,166,35,.15);color:#f5a623;border:1px solid rgba(245,166,35,.32)}
.mod-hs{background:rgba(242,102,139,.15);color:#f2668b;border:1px solid rgba(242,102,139,.34)}
.mod-me{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.34)}
.mod-mh{background:rgba(78,168,255,.15);color:#4ea8ff;border:1px solid rgba(78,168,255,.34)}
.mod-gv{background:rgba(250,204,21,.13);color:#facc15;border:1px solid rgba(250,204,21,.32)}
.mod-gh{background:rgba(34,211,238,.13);color:#22d3ee;border:1px solid rgba(34,211,238,.32)}
.mod-be{background:rgba(129,140,248,.14);color:#818cf8;border:1px solid rgba(129,140,248,.34)}
.mod-mf{background:rgba(34,197,94,.14);color:#22c55e;border:1px solid rgba(34,197,94,.34)}
.mod-pg{background:rgba(251,146,60,.14);color:#fb923c;border:1px solid rgba(251,146,60,.34)}

#gold-flash{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,22,40,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
#gold-flash.show{opacity:1;pointer-events:all}
.gf-title{font-size:26px;font-weight:800;color:#f0b429;margin-top:20px;letter-spacing:.02em}
.gf-sub{font-size:14px;color:#7a90b8;margin-top:8px}
.gf-coins{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:14px;font-weight:700}
#diamond-flash{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,22,40,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
#diamond-flash.show{opacity:1;pointer-events:all}
#reset-confirm{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,22,40,.92);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}
#reset-confirm.show{opacity:1;pointer-events:all}
.reset-card{background:#0e1e36;border:1.5px solid rgba(255,93,125,.4);border-radius:18px;padding:28px 26px;max-width:400px;width:100%;}
.gem-wrap{display:inline-block;position:relative;animation:gemFloat 3s ease-in-out infinite}
@keyframes gemFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}
.gem-float{display:block;filter:drop-shadow(0 0 4px rgba(120,210,255,.55))}
.coin-wrap{display:inline-flex;position:relative}
.coin3d-stage{display:inline-block;perspective:300px;vertical-align:middle}
.coin3d{position:relative;display:inline-block;transform-style:preserve-3d;animation:coin3dSpin 2.8s linear infinite}
@keyframes coin3dSpin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
.c3-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;
  background:radial-gradient(circle at 35% 35%,#f6f8fa,#cfd7e0 42%,#98a3b1 78%,#626c79 100%);
  color:#525c69;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.c3-core{position:absolute;inset:2%;border-radius:50%;background:#7d8794;display:block}
.icon-star{position:absolute;line-height:1;color:#eaffff;opacity:0;pointer-events:none;text-shadow:0 0 3px rgba(150,220,255,.85)}
.icon-star1{top:-10%;right:0;animation:iconStarPop 2.4s ease-in-out infinite;animation-delay:.2s}
.icon-star2{bottom:16%;left:-14%;animation:iconStarPop 2.4s ease-in-out infinite;animation-delay:1.1s}
.icon-star3{top:32%;right:-16%;animation:iconStarPop 2.4s ease-in-out infinite;animation-delay:1.8s}
@keyframes iconStarPop{0%,100%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1)}45%{opacity:0;transform:scale(.5)}}
.tile-gem-badge{position:absolute;top:-11px;right:-11px;width:38px;height:38px;z-index:2}

#tl-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,12,28,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
#tl-overlay.show{opacity:1;pointer-events:all}
.tl-panel{background:#1a1a1a;border-radius:20px;padding:20px 30px 24px;border:3px solid #333;box-shadow:0 0 40px rgba(0,0,0,.8),inset 0 2px 4px rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;gap:12px}
.tl-bar{width:6px;height:18px;background:#111;border-radius:3px;margin-bottom:4px}
.tl-light{width:60px;height:60px;border-radius:50%;border:3px solid #111;transition:box-shadow .12s,background .12s;position:relative}
.tl-light::after{content:'';position:absolute;top:6px;left:8px;width:18px;height:10px;border-radius:50%;background:rgba(255,255,255,.15);transform:rotate(-30deg)}
.tl-red{background:#2a0a0a}.tl-red.on{background:#ff2200;box-shadow:0 0 22px 8px rgba(255,34,0,.75)}
.tl-orange{background:#2a1a00}.tl-orange.on{background:#ff8c00;box-shadow:0 0 22px 8px rgba(255,140,0,.75)}
.tl-green{background:#002a0a}.tl-green.on{background:#00e040;box-shadow:0 0 22px 8px rgba(0,224,64,.75)}
.tl-go{font-size:40px;font-weight:900;color:#00e040;letter-spacing:.1em;opacity:0;text-shadow:0 0 24px rgba(0,224,64,.9);transition:opacity .15s;margin-top:10px}
.tl-go.show{opacity:1}

#unlock-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,12,28,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
#unlock-overlay.show{opacity:1;pointer-events:all}
.unlock-panel{background:#1a1a1a;border-radius:50%;width:140px;height:140px;border:3px solid #333;box-shadow:0 0 40px rgba(0,0,0,.8),inset 0 2px 4px rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;transition:border-color .2s,box-shadow .2s}
.unlock-panel.popped{border-color:#00e040;box-shadow:0 0 40px rgba(0,0,0,.8),inset 0 2px 4px rgba(255,255,255,.05),0 0 34px 10px rgba(0,224,64,.65)}
.unlock-icon{font-size:64px;display:inline-block}
.unlock-panel.shaking .unlock-icon{animation:unlockShake .12s ease 3}
@keyframes unlockShake{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes popScale{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.unlock-panel.popped .unlock-icon{animation:popScale .3s ease}
.unlock-text{font-size:32px;font-weight:900;color:#00e040;letter-spacing:.08em;opacity:0;text-shadow:0 0 24px rgba(0,224,64,.9);transition:opacity .15s;margin-top:18px}
.unlock-text.show{opacity:1}

#f1-container{position:fixed;bottom:70px;left:0;width:100%;pointer-events:none;z-index:1001;overflow:hidden;height:64px;opacity:0;transition:opacity .2s}
#f1-container.show{opacity:1}
#f1-car{position:absolute;left:-220px;bottom:0}
@keyframes f1Drive{0%{left:-220px}100%{left:110%}}
.f1-track-line{position:fixed;bottom:68px;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(240,180,41,.7) 30%,rgba(240,180,41,.7) 70%,transparent 100%);z-index:1000;opacity:0;transition:opacity .25s}
.f1-track-line.show{opacity:1}

@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.confetti-piece{position:fixed;top:-10px;pointer-events:none;z-index:9990;animation:confettiFall linear forwards}
#sc-celebrate{background:#0a1628;min-height:100vh;position:relative;overflow:hidden}

@keyframes spinBounce{0%{transform:scale(0) rotateY(180deg)}60%{transform:scale(1.25) rotateY(0deg)}80%{transform:scale(.95)}100%{transform:scale(1) rotateY(0deg)}}
@keyframes coinPop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}
.coin-pop{position:fixed;font-size:14px;font-weight:800;color:#b0c4de;pointer-events:none;animation:coinPop .9s ease forwards;z-index:998}
@keyframes scorePopAnim{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.score-flash{position:fixed;font-size:16px;font-weight:800;pointer-events:none;animation:scorePopAnim .7s ease forwards;z-index:998}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s ease}
.mterm{padding:12px 14px;background:#152038;border:2px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;cursor:grab;font-size:13.5px;font-weight:700;margin-bottom:9px;transition:all .15s;user-select:none}
.mterm:active{cursor:grabbing}
.mterm.picked{border-color:#f0b429;background:rgba(240,180,41,.14);box-shadow:0 0 0 2px rgba(240,180,41,.25)}
.mdef{padding:12px 14px;border:2px solid #d4a017;border-radius:12px;font-size:12.5px;font-weight:700;color:#182234;background:#fff;margin-bottom:9px;line-height:1.4;cursor:pointer;transition:all .15s;min-height:20px}
.mdef:hover{border-color:#f0b429}
.mdef.solved{border:2px solid #00a389;background:#f0fdfa;color:#0f2e28;cursor:default}
.mdef.solved .mterm-tag{display:inline-block;background:#00c4a7;color:#06281f;font-weight:800;font-size:11px;padding:2px 9px;border-radius:20px;margin-bottom:6px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease}

/* HINT */
.hint-box{border-radius:12px;padding:12px 16px;margin-bottom:14px;border:1.5px solid rgba(206,130,255,.35);background:rgba(206,130,255,.08);display:flex;align-items:flex-start;gap:11px;animation:fadeIn .2s ease}
.hint-btn{border:none;cursor:pointer;border-radius:10px;font-weight:700;font-family:inherit;font-size:13px;padding:10px 16px;display:flex;align-items:center;gap:7px;transition:all .15s;background:rgba(206,130,255,.12);color:#ce82ff;border:1.5px solid rgba(206,130,255,.3);justify-content:space-between;box-sizing:border-box;min-height:46px;}
.hint-btn:hover:not([disabled]){background:rgba(206,130,255,.2);border-color:#ce82ff}
.hint-btn:disabled{opacity:.4;cursor:not-allowed}

</style>
</head>
<body class="hub-light">
<div id="app">
  <div id="sc-login"     class="sc"></div>
  <div id="sc-hub"       class="sc on"></div>
  <div id="sc-home"      class="sc"></div>
  <div id="sc-game"      class="sc"></div>
  <div id="sc-res"       class="sc"></div>
  <div id="sc-celebrate" class="sc"></div>
  <div id="sc-speed"     class="sc"></div>
  <div id="sc-challenge" class="sc"></div>

    {tp:'mc',lb:'',q:'The free rider problem occurs because...',o:['governments always overcharge for public services','people can benefit from a non-excludable good without paying for it','private firms refuse to lower their prices','consumers have too much information'],a:1},
    {tp:'mc',lb:'',q:'Why does non-excludability directly cause the free rider problem?',o:['because the good is too expensive to produce','because the government bans private payment','because the good has no substitutes','because no one can be stopped from using the good, there is little incentive to pay for it voluntarily'],a:3},
    {tp:'mc',lb:'',q:'Left entirely to the free market, public goods tend to be...',o:['under-provided or not provided at all','over-provided','provided at exactly the socially optimal quantity','provided only to wealthy consumers'],a:0},
    {tp:'mc',lb:'',q:'Why do private firms have little incentive to supply a pure public good?',o:['because the government legally prohibits it','because they cannot exclude non-payers, they cannot reliably charge for it and earn a profit','because public goods are too simple to produce','because consumers dislike public goods'],a:1},
    {tp:'mc',lb:'',q:'Which scenario best illustrates free-riding?',o:['a customer pays full price for a cinema ticket','a firm invests in new machinery','a household switches to a cheaper supermarket','a resident enjoys a town\u2019s street lighting every night without contributing anything toward its cost'],a:3},
    {tp:'blank',lb:'Fill in the blank',q:'Complete the statement:',s:'Because a public good is non-excludable, people have an incentive to let others pay while they _____',o:['pay double the price','refuse to consume it','free ride and consume it anyway','demand a subsidy'],a:2},
    {tp:'mc',lb:'',q:'The free rider problem is ultimately a consequence of which characteristic of public goods?',o:['non-excludability','non-rivalry','high production cost','government regulation'],a:0}
  ]},
  {t:'Government Responses to Public Goods',ic:'\ud83c\udfdb\ufe0f',mod:'pg',qs:[
    {tp:'mc',lb:'',q:'"Direct provision" means...',o:['a private firm sets its own price for the good','the good is left entirely to the free market','the government itself supplies and funds the public good','consumers vote on the good\u2019s price each year'],a:2},
    {tp:'mc',lb:'',q:'"Contracting out" means...',o:['the government pays a private firm to supply the public good on its behalf','the government bans private firms from the market','a private firm funds the government directly','consumers contract directly with each other'],a:0},
    {tp:'mc',lb:'',q:'Which is an example of direct provision?',o:['a government paying a construction company to build a road','a private firm operating a toll bridge','a charity funding a local park','a national government employing staff and running the country\u2019s armed forces itself'],a:3},
    {tp:'mc',lb:'',q:'Which is an example of contracting out?',o:['a government directly employing all road workers as civil servants','a government paying a private construction firm to build and maintain public roads on its behalf','a private firm building a road entirely at its own risk and charging drivers a toll','a charity building a road with donated funds'],a:1},
    {tp:'mc',lb:'',q:'A key strength of direct government provision is that...',o:['it is always cheaper than private production','it requires no taxation','it guarantees the good is actually supplied, correcting the under-provision caused by the free rider problem','it eliminates the free rider problem entirely from all other markets'],a:2},
    {tp:'mc',lb:'',q:'A key limitation of direct government provision is that...',o:['government production may be less efficient, and funding it has an opportunity cost for other public spending','it is illegal in most countries','the private sector is legally required to fund it','it always leads to over-provision'],a:0},
    {tp:'blank',lb:'Fill in the blank',q:'Complete the statement:',s:'Government provision of public goods is funded primarily through _____',o:['private donations only','taxation','foreign aid','lottery winnings'],a:1}
  ]},
  {t:'Key Terms — Asymmetric Information',ic:'📖',mod:'ai',qs:[
    {tp:'match',lb:'Match the terms',q:'Match each term to its meaning.',pairs:[
      ['Asymmetric information','A situation where one party to a transaction or agreement has more or better information than the other party'],
      ['Adverse selection','An information problem that exists before a transaction, where the less-informed party ends up disproportionately dealing with the least desirable counterparts'],
      ['Moral hazard','An information problem that arises after an agreement is made, where one party changes their behaviour because they no longer bear the full consequences of it']
    ]},
    {tp:'match',lb:'Match the terms',q:'Match each term to its meaning.',pairs:[
      ['Legislation and regulation','A government response to asymmetric information that sets legal rules or standards, reducing the ability of one side to exploit an information advantage'],
      ['Provision of information','A government response to asymmetric information that involves supplying information directly to the less-informed party']
    ]},
    {tp:'match',lb:'Match the terms',q:'Match each term to its meaning.',pairs:[
      ['Signalling','A private response to asymmetric information in which the better-informed party takes a costly, credible action to reveal information about themselves'],
      ['Screening','A private response to asymmetric information in which the less-informed party designs a process to sort the other side by type']
    ]}
  ]},
  {t:'Adverse Selection',ic:'🚗',mod:'ai',qs:[

    {tp:'mc',lb:'',q:'In the classic "used car" example of adverse selection, who typically holds more information about the car\u2019s true quality?',o:['The buyer','The seller','The government','Neither party'],a:1},
    {tp:'mc',lb:'',q:'If buyers can\u2019t tell good cars from bad ones, they will only offer an average price for any car. What is the likely result?',o:['Only high-quality cars are sold','Prices rise above the value of any car on the market','Owners of good cars have little incentive to sell, since they would receive less than the car is really worth','The market becomes perfectly informed'],a:2},
    {tp:'mc',lb:'',q:'Adverse selection is sometimes illustrated using a well-known nickname for the low-quality goods that come to dominate an under-informed market.',o:['Peaches','Oranges','Apples','Lemons'],a:3},
    {tp:'mc',lb:'',q:'In health insurance markets, adverse selection can occur because...',o:['insurers always know more than applicants','people who know they are more likely to need care are more likely to buy insurance','only healthy people buy insurance','premiums are fixed by law'],a:1},
    {tp:'blank',lb:'Fill in the blank',q:'Complete the statement:',s:'Adverse selection is an information problem that exists _____ a transaction or agreement takes place',o:['after','during','before','only outside'],a:2},
    {tp:'mc',lb:'',q:'Adverse selection is best described as a problem of...',o:['hidden characteristics known before the deal is made','hidden actions taken after the deal is made','perfect information','government failure'],a:0}
  ]},
  {t:'Moral Hazard',ic:'🛡️',mod:'ai',qs:[
    {tp:'mc',lb:'',q:'Moral hazard is an information problem that arises at which point in a transaction?',o:['Before an agreement is made','After an agreement is made','Before any contact between the parties','Only in public goods markets'],a:1},
    {tp:'mc',lb:'',q:'Which scenario best illustrates moral hazard?',o:['A buyer purchases a car without inspecting it first','A firm advertises its product truthfully','A driver with fully comprehensive insurance starts parking more carelessly, since they no longer bear the full cost of any damage','A government bans a harmful product'],a:2},
    {tp:'mc',lb:'',q:'Moral hazard arises because one party...',o:['has no information at all','is legally required to act carelessly','cannot observe prices','no longer bears the full consequences of their own actions once an agreement is in place'],a:3},
    {tp:'mc',lb:'',q:'Which of the following is a classic example of moral hazard in banking?',o:['A bank takes on excessively risky loans because it expects to be bailed out if things go wrong','A bank refuses all loan applications','A bank publishes its interest rates publicly','A bank has too many competitors'],a:0},
    {tp:'mc',lb:'',q:'What is the key difference between adverse selection and moral hazard?',o:['There is no meaningful difference between them','Adverse selection only applies to insurance markets','Adverse selection is a pre-agreement problem of hidden characteristics; moral hazard is a post-agreement problem of hidden actions','Moral hazard only applies to used car markets'],a:2},
    {tp:'blank',lb:'Fill in the blank',q:'Complete the statement:',s:'Moral hazard is an information problem that arises _____ an agreement has already been made',o:['after','before','during','never'],a:0},
    {tp:'mc',lb:'',q:'Why might an insurer worry about moral hazard once a policy has been signed?',o:['The insurer now has more information than the insured party','The insured party has less incentive to take care, since losses are covered by the insurer','Premiums automatically fall once a policy is signed','The insured party leaves the market'],a:1}
  ]},
  {t:'Government & Private Responses to Asymmetric Information',ic:'🔍',mod:'ai',qs:[

    {tp:'mc',lb:'',q:'"Provision of information" as a government response means the government...',o:['bans the transaction entirely','sets the price of the good by law','subsidises the better-informed party','supplies information directly to the less-informed party so they can make a better-informed decision'],a:3},

    {tp:'mc',lb:'',q:'"Signalling" means...',o:['the less-informed party investigates the other side before agreeing to a deal','the better-informed party takes a costly, credible action to reveal information about themselves to the other side','the government bans the transaction','prices are fixed by regulation'],a:1},
    {tp:'mc',lb:'',q:'"Screening" means...',o:['the better-informed party reveals information voluntarily','the government provides information directly to consumers','the firm is nationalised by the government','the less-informed party designs a process to sort the other side by type before making a decision'],a:3},
    {tp:'mc',lb:'',q:'A university requiring applicants to submit standardized test scores before admission is an example of...',o:['signalling','screening','legislation','a subsidy'],a:1},

  ['PED = %\u0394Qd ÷ %\u0394P. If the numerator becomes enormous, the whole fraction blows up.','So near point A, PED approaches infinity.'],
  ['Point B is the low-price, high-quantity end of the curve.','There the large %\u0394P drives |PED| down to 0.'],
  ['Percentage changes are measured relative to the starting value, which differs at each point.','So the same slope produces different PED values — PED uses relative changes, not the slope.'],
  ['%ΔQ = 5 ÷ 10 = 50%; %ΔP = $1 ÷ $18 ≈ 5.6%.','PED ≈ 50 ÷ 5.6 ≈ 9 — highly elastic at A.'],
  ['%ΔQ = 5 ÷ 90 ≈ 5.6%; %ΔP = $1 ÷ $2 = 50%.','PED ≈ 5.6 ÷ 50 ≈ 0.11 — highly inelastic at B.']],
 /* 9 — PED & Total Revenue */
 [['Total revenue is simply what the firm earns from sales.','It equals price multiplied by the quantity sold.'],
  ['Elastic means quantity responds strongly to price.','If price falls, quantity rises by proportionately more, so total revenue rises.'],
  ['Elastic demand: the percentage fall in quantity outweighs the percentage rise in price.','So raising price makes total revenue fall.'],
  ['Inelastic means quantity barely responds to price.','If price rises, quantity falls by proportionately less, so total revenue rises.'],
  ['Inelastic demand: the percentage rise in quantity is smaller than the percentage fall in price.','So cutting price makes total revenue fall.'],
  ['Unit elastic means the two percentage changes exactly cancel out.','So total revenue stays unchanged when price changes.'],
  ['Revenue rises as you move down the elastic region and falls in the inelastic region.','It peaks exactly where demand is unit elastic.'],
  ['Picture revenue rising, reaching a peak, then falling as quantity increases.','That gives a hill / dome shape, with the peak at the midpoint of the demand curve.'],
  ['With PED = 2, the percentage change in quantity (20%) beats the percentage change in price (10%).','Elastic demand + a price rise means total revenue falls.']],
 /* 10 — Marginal Revenue & TR Maximisation */
 [['Marginal always means \u201cone more\u201d in economics.','Marginal revenue is the extra revenue from selling one additional unit.'],
  ['MR measures the rate at which total revenue changes as output rises.','That makes it the gradient (slope) function of the total revenue curve.'],
  ['The price a firm charges is the revenue it gets per unit on average.','So the demand curve is also the firm\u2019s average revenue (AR) curve.'],
  ['For a straight-line demand curve, MR starts at the same price intercept but falls faster.','It is twice as steep as the demand curve.'],
  ['Total revenue stops rising and starts falling at its peak.','At that peak the slope is flat, so marginal revenue equals 0.'],
  ['TR peaks at the midpoint of the demand curve.','That is exactly where MR = 0 and PED = 1.'],
  ['While each extra unit still adds revenue, MR is positive.','That happens in the elastic region of the demand curve.'],
  ['Once extra units start subtracting from revenue, MR is negative.','That happens in the inelastic region of the demand curve.'],
  ['MR < 0 means selling more is actually reducing total revenue — you are below the midpoint.','To raise revenue, cut output and raise price, moving back up toward the midpoint.'],
  ['MR is twice as steep, so it reaches the quantity axis at half the demand curve\u2019s quantity intercept.','Half of 40 units is 20 units.']],
 /* 11 — Primary Commodities vs Manufactured Products */
 [['Primary commodities are raw materials and farm/extractive goods like oil, wheat and minerals.','Their demand is generally less responsive to price, so PED is lower (more inelastic).'],
  ['Primary commodities come straight from natural resources or the factor of production \u201cland\u201d.','Crude oil is a classic example.'],
  ['Manufactured products are processed, finished goods made in factories.','A television is a manufactured product.'],
  ['If you can\u2019t easily swap to an alternative, you keep buying even when price rises.','Primary commodities often have few close substitutes, making demand inelastic.'],
  ['When close alternatives exist, buyers switch away as soon as price rises.','Manufactured products usually have close substitutes, making demand more elastic.'],
  ['Inelastic demand means quantity hardly changes, so the price must move a lot to clear the market.','So a shift in supply causes large price changes.'],
  ['Big, unpredictable price swings mean revenue jumps up and down.','That makes primary-commodity producers\u2019 incomes very unstable.'],
  ['Few substitutes plus being a necessity means buyers can\u2019t cut back much.','So the demand for primary commodities is relatively inelastic.']],
 /* 12 — HL Demand Elasticity Challenge */
 [['The midpoint is the dividing line between the elastic and inelastic halves.','There the percentage changes are equal, so |PED| = 1.'],
  ['Above the midpoint is the high-price, low-quantity end.','That region is elastic.'],
  ['Near point B, price is tiny, so %\u0394P is huge and dominates the formula.','That drives |PED| toward 0.'],
  ['Near point A, quantity is tiny, so %\u0394Qd is huge and dominates the formula.','That drives |PED| toward infinity.'],
  ['Revenue peaks where selling one more unit adds nothing extra (MR = 0)...','...and that is exactly where PED = 1.'],
  ['MR shares the demand curve\u2019s price intercept but descends faster.','It is twice as steep as the demand curve.'],
  ['PED = 0.5 is inelastic, so quantity barely responds.','Cutting price when demand is inelastic makes total revenue fall.'],
  ['MR < 0 means you are below the midpoint, in the inelastic region.','Raising price (reducing output) moves you back toward the revenue-maximising midpoint.'],
  ['Primary commodities have few substitutes and are often necessities.','So their demand is more inelastic than that of manufactured goods.'],
  ['MR = 0 sits where total revenue stops rising and starts falling.','That is the midpoint of the demand curve.'],
  ['Price is revenue per unit, i.e. revenue \u201con average\u201d.','So the demand curve is also the average revenue curve.'],
  ['Total revenue is maximised at the midpoint, i.e. half the quantity intercept.','Half of 60 units is 30 units.']],
 /* 13 — Introduction to PES */
 [['PES is about SUPPLY reacting to PRICE.','Quantity supplied responds to a change in price.'],
  ['A higher PES = more responsive producers.','They can adjust output more easily.'],
  ['PES divides by the change in price.','%\u0394Qs ÷ %\u0394P.'],
  ['Law of supply: price and quantity supplied move together.','So PES is positive.'],
  ['Elastic supply = output changes a lot when price changes.','Producers respond strongly.']],
 /* 14 — Price Elasticity of Supply I */
 [['PES = %\u0394Qs ÷ %\u0394P = 30 ÷ 10.','That gives 3.'],
  ['PES = %\u0394Qs ÷ %\u0394P = 10 ÷ 20.','That gives 0.5.'],
  ['PES measures quantity SUPPLIED.','Fill the blank with quantity supplied.'],
  ['%\u0394P = 20%, %\u0394Qs = 30%.','PES = 30 ÷ 20 = 1.5.'],
  ['No change in quantity supplied = zero responsiveness.','PES = 0.']],
 /* 15 — Price Elasticity of Supply II */
 [['Values between 0 and 1 are inelastic.','0.4 < 1 \u2192 inelastic.'],
  ['Values above 1 are elastic.','3 > 1 \u2192 elastic.'],
  ['PES = 1 is the special in-between case.','Unit elastic.'],
  ['Zero responsiveness = perfectly inelastic.','PES = 0.'],
  ['Perishable goods can\u2019t be quickly increased.','Fresh strawberries \u2192 inelastic supply.']],
 /* 16 — Determinants of PES */
 [['Think about what limits how fast firms can change output.','Mobility of factors of production is a key determinant.'],
  ['Spare capacity means firms can ramp up quickly.','That makes supply more elastic.'],
  ['If goods can be stored, firms can release stock when price rises.','That makes supply more elastic.'],
  ['More time = more ability to adjust resources.','So supply is more elastic in the long run.'],
  ['Crops take a growing season to produce.','So short-run agricultural supply is inelastic.']],
 /* 17 — PES, Time & Application */
 [['With almost no time to react, firms can\u2019t change output.','Momentary/short-run supply is inelastic.'],
  ['Manufactured goods can be made and stored more easily.','So their supply is more elastic.'],
  ['More time lets firms adjust factors of production.','Supply becomes more elastic.'],
  ['Subsidies cut costs and encourage more output.','That makes supply more elastic.'],
  ['PES shows how fast producers can react to a price change.','Useful for planning output.']],
 /* 18 — Elasticity of Supply Challenge */
 [['Equal percentage changes \u2192 PES = 1.','15 ÷ 15 = 1 (unit elastic).'],
  ['PES > 1 means quantity supplied is very responsive.','It changes by a larger proportion than price.'],
  ['%\u0394P = 25%, %\u0394Qs = 10%.','PES = 10 ÷ 25 = 0.4.'],
  ['Goods that can\u2019t be stored can\u2019t be supplied flexibly.','So supply is inelastic.'],
  ['Spare capacity lets a firm expand output easily.','That means a high PES.'],
  ['Spare capacity = ability to increase output fast.','That makes supply more elastic.']],
 /* 19 — HL Supply: Recap & the Key Question */
 [['PES is the supply-side twin of PED.','It measures how responsive quantity supplied is to a change in price.'],
  ['The formula divides by the change in price.','PES = % change in quantity supplied ÷ % change in price.'],
  ['The one HL-only supply idea compares two kinds of good.','It asks why primary commodities and manufactured products differ in PES.'],
  ['Think raw and unprocessed — straight from farms, mines or wells.','A primary commodity is a raw material or agricultural product.'],
  ['Think processed and factory-made.','A manufactured product is a processed or factory-made good.'],
  ['Which option comes straight from the land, not a factory?','Wheat is grown, so it is the primary commodity.'],
  ['Which option is processed in a factory?','A television is assembled/manufactured, so it is the manufactured product.']],
 /* 20 — Why Primary Commodities Have Low PES */
 [['Crops can\u2019t be grown overnight — nature sets the pace.','Supply depends on growing seasons and time, so it is slow to respond.'],
  ['You can\u2019t conjure more suitable farmland instantly.','Fixed, limited land makes supply more inelastic.'],
  ['Living things grow on their own timetable.','Because production takes time, output can\u2019t be increased quickly.'],
  ['Specific farmland or a mine can\u2019t easily switch to something else.','Primary factors of production are relatively immobile.'],
  ['Opening or expanding a mine is slow and expensive.','So the response to a price rise is costly and complex — inelastic supply.'],
  ['If it spoils, you can\u2019t stockpile it to release later.','Perishability makes supply more inelastic.'],
  ['Slow, constrained production means low responsiveness.','So primary commodities tend to have a low PES.'],
  ['Look for the answer about time and natural limits.','Production is constrained by time and nature.']],
 /* 21 — Why Manufactured Products Have High PES */
 [['A factory line can speed up in a way a field cannot.','Output can be raised quickly by adjusting labour and machinery.'],
  ['Unused machines and space can be switched on fast.','Spare capacity makes supply more elastic.'],
  ['Workers and machines can be redeployed between products.','Manufacturing factors are relatively mobile.'],
  ['Holding stock lets a firm release more when price rises.','The ability to store makes supply more elastic.'],
  ['Simple, labour-intensive lines can hire quickly.','Being able to add workers easily makes supply more elastic.'],
  ['Rapid scaling is the hallmark of responsive supply.','Fast-scaling electronics production is elastic supply.'],
  ['Quick, flexible production means high responsiveness.','So manufactured products tend to have a high PES.'],
  ['Factories out-respond farms.','So manufactured supply is more elastic than primary supply.']],
 /* 22 — Comparing PES: Determinants Applied */
 [['Crops take a season; toys take hours.','The key difference is the time needed to produce.'],
  ['There are five determinants; four are time, mobility, spare capacity and storage.','The fifth is the rate at which costs rise as output increases.'],
  ['Farmland and mines are hard to repurpose.','Primary factor mobility is low.'],
  ['Factories often run below full capacity.','So manufacturers usually have more spare capacity.'],
  ['If pushing out more output sends costs soaring, firms hold back.','Rapidly rising costs make supply more inelastic.'],
  ['Which option is a fast, factory-made good?','Plastic phone cases are manufactured, so higher PES.'],
  ['Which option is a slow-growing natural good?','Fresh strawberries are primary/perishable, so lower PES.'],
  ['Slow production plus immobile factors = unresponsive supply.','That gives a low PES.']],
 /* 23 — Why It Matters: Volatility & Application */
 [['If quantity can\u2019t adjust, price does the adjusting.','Inelastic supply means demand shifts cause large price changes.'],
  ['Wild price swings mean earnings jump around.','So primary producers\u2019 incomes become very unstable.'],
  ['If quantity can\u2019t adjust, the price must do all the moving.','So inelastic supply tends to make prices highly volatile.'],
  ['A bumper harvest pushes supply out; with inelastic demand, price must drop a lot to clear it.','So the price tends to fall sharply.'],
  ['Elastic supply can flex with demand, cushioning price movements.','So manufactured-goods prices tend to be more stable.'],
  ['Responsive supply reacts fast to price signals.','High-PES manufacturing responds more quickly.'],
  ['Inelastic on both sides of the market amplifies swings.','So the price becomes highly volatile.']],
 /* 24 — HL Elasticity of Supply Challenge */
 [['The whole HL point is a comparison of two goods.','Primary PES is generally lower than manufactured PES.'],
  ['Crops follow the calendar, not the factory clock.','Agricultural supply is inelastic due to time and natural conditions.'],
  ['Factories can flex labour and machines fast.','That quick adjustment gives manufactured goods a higher PES.'],
  ['%\u0394P = (0.45\u22120.30)/0.30 = 50%; %\u0394Qs = (600\u2212500)/500 = 20%.','PES = 20 ÷ 50 = 0.4.'],
  ['A value between 0 and 1 is inelastic.','0.4 < 1, so supply is inelastic.'],
  ['Which good is fast and factory-made?','Mass-produced toys have the highest PES here.'],
  ['Unstable prices feed straight into unstable earnings.','So inelastic primary supply makes incomes volatile.'],
  ['A factory out-paces a farm.','A toy factory can increase output more quickly.'],
  ['%\u0394Qs ÷ %\u0394P = 10 ÷ 5 = 2, and 2 > 1.','So PES = 2 and supply is elastic.'],
  ['Recall the core HL reason for low primary PES.','Production is constrained by time and nature.']],
 /* 25 — What is Market Equilibrium? */
 [['Equilibrium is the balance point where the two market forces meet.','It is where quantity demanded equals quantity supplied.'],
  ['If nothing pushes price up or down, the market is settled.','At equilibrium there is no tendency for price to change.'],
  ['\u201cClearing\u201d means everything offered is bought — nothing left over, none missing.','So the equilibrium price is the market-clearing price.'],
  ['No single side sets it — it emerges from their interaction.','Demand and supply together determine equilibrium price and quantity.'],
  ['On the diagram, look for the single crossing point.','Equilibrium is where the demand and supply curves intersect.'],
  ['At equilibrium, quantity bought = quantity sold.','That amount is the equilibrium quantity.']],
 /* 26 — Shortages & Surpluses */
 [['Below equilibrium, the low price attracts lots of buyers but few sellers.','Quantity demanded exceeds quantity supplied — a shortage (excess demand).'],
  ['Above equilibrium, the high price attracts many sellers but few buyers.','Quantity supplied exceeds quantity demanded — a surplus (excess supply).'],
  ['\u201cExcess demand\u201d = demand is the bigger side.','Quantity demanded exceeds quantity supplied.'],
  ['With unsold stock, sellers undercut each other to sell.','So a surplus pushes the price down.'],
  ['When goods are scarce, buyers bid against each other.','So a shortage pushes the price up.'],
  ['\u201cSurplus\u201d and \u201cexcess supply\u201d are two names for the same thing.','A surplus is excess supply.'],
  ['Rising/falling prices erase the gap between Qd and Qs.','So price changes remove shortages and surpluses, restoring equilibrium.']],
 /* 27 — Shifts in Demand */
 [['More demand at every price pushes the demand curve right, meeting supply higher up.','So equilibrium price rises.'],
  ['The new crossing point is further to the right along supply.','So equilibrium quantity rises too.'],
  ['A leftward demand shift meets supply lower and to the left.','So both equilibrium price and quantity fall.'],
  ['A rightward demand shift needs a non-price reason to buy more.','Higher income (for a normal good) shifts demand right.'],
  ['If a substitute gets pricier, buyers switch toward this good.','So demand for this good shifts right.'],
  ['A non-price determinant is anything except the good\u2019s own price.','Consumer tastes and preferences is a non-price determinant.']],
 /* 28 — Shifts in Supply */
 [['More supply at every price pushes the supply curve right, meeting demand lower down.','So equilibrium price falls.'],
  ['The new crossing point is further right along demand.','So equilibrium quantity rises.'],
  ['Less supply meets demand higher and to the left.','Price rises and quantity falls.'],
  ['A rightward supply shift needs producing to become easier or cheaper.','Lower production costs shift supply right.'],
  ['Better technology lets firms make more at each price.','So it shifts supply to the right.'],
  ['A tax adds to producers\u2019 costs, so they supply less at each price.','So an indirect tax shifts supply left.']],
 /* 29 — The Price Mechanism */
 [['No central planner is needed — prices do the coordinating.','Resources are allocated by the free interaction of demand and supply.'],
  ['When something is scarce, its price rises and some buyers drop out.','That is the rationing function of price.'],
  ['A changing price is a message about where resources are wanted.','That is the signalling function.'],
  ['A higher price is a reward that changes behaviour.','That is the incentive function.'],
  ['A reward that pulls resources into a market is an incentive.','So a higher price attracting firms is the incentive function.'],
  ['A price that carries information is signalling.','A rising price signals the good is now more valued.'],
  ['In a free market economy, the coordinating device is price.','Resources are allocated by the price mechanism.']],
 /* 30 — Surplus & Allocative Efficiency */
 [['It is the \u201cbonus\u201d buyers get by paying less than their maximum.','Consumer surplus = willingness to pay \u2212 price actually paid.'],
  ['It is the \u201cbonus\u201d sellers get by receiving more than their minimum.','Producer surplus = price received \u2212 minimum acceptable price.'],
  ['Add the two surpluses together for the total welfare.','Social surplus = consumer surplus + producer surplus.'],
  ['CS sits under the demand curve but above the price line.','It is the area between the demand curve and the price, above the price.'],
  ['Efficiency here means the biggest possible total welfare.','At equilibrium, community (social) surplus is maximised.'],
  ['The competitive equilibrium gives the largest total surplus.','So community surplus is maximised there.'],
  ['Producing too little leaves some beneficial trades unmade.','That missing welfare is a welfare loss.']],
 /* 31 — Market Equilibrium Challenge */
 [['Equilibrium is the balance of the two forces.','It is where quantity demanded equals quantity supplied.'],
  ['A high price attracts sellers but deters buyers.','So a price above equilibrium creates a surplus.'],
  ['Demand right-shift meets supply higher and further right.','So both equilibrium price and quantity rise.'],
  ['Cheaper production shifts supply right, lowering price and raising output.','So equilibrium quantity rises.'],
  ['Rationing works by price rising to choke off some demand.','A shortage pushing price up (reducing Qd) shows the rationing function.'],
  ['Maximum total surplus = allocative efficiency.','So the market is allocatively efficient at equilibrium.'],
  ['Below equilibrium, demand outstrips supply.','That excess demand is called a shortage.'],
  ['Signalling = carrying information to buyers and sellers.','So \u201cSignalling — provides information\u201d is the correct pairing.']],
 /* 32 — Surplus as an Area */
 [['It is the buyer\u2019s \u201cbonus\u201d from a good deal.','CS = willingness to pay \u2212 what they actually pay.'],
  ['CS lives under the demand curve but on top of the price line.','It is the area between the demand curve and the price, above the price.'],
  ['It is the seller\u2019s \u201cbonus\u201d from a good deal.','PS = price received \u2212 the minimum they would accept.'],
  ['PS lives on top of the supply curve but under the price line.','It is the area between the price and the supply curve, below the price.'],
  ['Two straight lines and a vertical drop enclose a three-sided shape.','Each surplus forms a triangle.'],
  ['Add the two private surpluses for the total welfare.','Social surplus = consumer surplus + producer surplus.'],
  ['Efficiency means the biggest possible total welfare.','At the competitive equilibrium, social surplus is maximised.']],
 /* 33 — The Triangle Formula */

  ['\u00bd \u00d7 20 \u00d7 6.','= 60.'],
  ['Remember the \u00bd.','Area = \u00bd \u00d7 base \u00d7 height.']],

 /* 36 — Community Surplus & Welfare Loss */
 [['Just add the two surpluses.','$160 + $160 = $320.'],

 /* 38 — Why Governments Intervene */
 [['Taxes on goods bring money into the treasury.','Earning government revenue is a key reason for intervention.'],
  ['The aim is to change how much people buy.','Cigarette taxes influence the level of consumption.'],
  ['The payment helps producers, not buyers.','Subsidising solar-panel makers supports firms.'],

 /* 39 — Price Ceilings */
 [['A maximum only bites if the market wants to go higher.','It must be set below the equilibrium price to have an effect.'],
  ['A low price attracts buyers but repels sellers.','A binding ceiling creates a shortage (Qd > Qs).'],
  ['If price can\u2019t allocate, something else must.','Queues and waiting lists are non-price rationing.'],
  ['Desperate buyers may pay illegally above the cap.','Shortages encourage informal (parallel) markets.'],
  ['Think housing.','Rent controls are a classic price ceiling.'],
  ['They must sell at a lower price and sell less.','Producers lose from a binding ceiling.'],
  ['If the cap is above the market price, the market never reaches it.','It has no effect.']],
 /* 40 — Price Floors */
 [['A minimum only bites if the market wants to go lower.','It must be set above the equilibrium price to have an effect.'],
  ['A high price attracts sellers but repels buyers.','A binding floor creates a surplus (Qs > Qd).'],

 /* 41 — Indirect Taxes */
 [['The tax adds to sellers\u2019 costs at every quantity.','Supply shifts left/up by the tax.'],

 /* 42 — Subsidies */

 /* 43 — Other Tools & Government Challenge */

 /* 44 — Consumer Nudges (HL) */

/* ── Scaffolding: move fill-in-the-blank questions toward the start of each lesson ──
   Keeps each lesson's opening question first, then blanks, then the rest.
   Hints are permuted identically so they stay attached to their questions. */
(function scaffoldBlanks(){
  for(var i=0;i<D.length;i++){
    var qs=D[i].qs, hs=HINTS[i];
    if(!qs||!hs||hs.length!==qs.length) continue;
    var blanks=[], rest=[];
    for(var j=1;j<qs.length;j++){ (qs[j].tp==='blank'?blanks:rest).push(j); }
    if(!blanks.length) continue;
    var perm=[0].concat(blanks).concat(rest);
    D[i].qs=perm.map(function(j){return qs[j];});
    HINTS[i]=perm.map(function(j){return hs[j];});
  }
})();

/* ===================== MODULE HUB (top-level picker) ===================== */
function rHub(){
  if(PENDING_JOIN_CODE){
    var pjc=PENDING_JOIN_CODE; PENDING_JOIN_CODE=null;
    CHALLENGE.speedType=null; CHALLENGE.fromHub=true; CHALLENGE.prefillCode=pjc;
    sw('challenge'); rChallengeSetup();
    return;
  }
  var totalDone=S.dn.size, totalLes=D.length;
  var SLC='#0f766e', HLC='#b45309';           /* SL = deep teal, HL = deep amber */
  var INK='#182234', MUT='#7a90b8', TILEBORDER='#d7e3f2', TRACK='#e2ebf7';
  function lvlCol(l){ return l==='HL'?HLC:SLC; }
  function ring(col,pct,size){
    var r=26,c=2*Math.PI*r,arc=(pct/100)*c;
    var uid='rg'+(_ringUid++);
    var wallCols=[shadeColor(col,-0.62),shadeColor(col,-0.52),shadeColor(col,-0.42),shadeColor(col,-0.28)];
    var offs=[[0.9,1.4],[0.7,1.0],[0.5,0.6],[0.2,0.2]];
    var layers='';
    for(var i=0;i<offs.length;i++){
      var ox=(36+offs[i][0]).toFixed(2), oy=(36+offs[i][1]).toFixed(2);
      layers+='<circle cx="'+ox+'" cy="'+oy+'" r="26" fill="none" stroke="'+wallCols[i]+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+arc.toFixed(1)+' '+(c-arc).toFixed(1)+'" transform="rotate(-90 '+ox+' '+oy+')"/>';
    }
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 72 72" style="flex-shrink:0;">'
      +'<defs>'
      +'<linearGradient id="'+uid+'" x1="10%" y1="0%" x2="90%" y2="100%"><stop offset="0%" stop-color="'+shadeColor(col,0.35)+'"/><stop offset="100%" stop-color="'+col+'"/></linearGradient>'
      +'<filter id="sh'+uid+'" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#182234" flood-opacity="0.25"/></filter>'
      +'</defs>'
      +'<circle cx="36" cy="36" r="26" fill="none" stroke="'+TRACK+'" stroke-width="9"/>'
      +layers
      +'<circle cx="36" cy="36" r="26" fill="none" stroke="url(#'+uid+')" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+arc.toFixed(1)+' '+(c-arc).toFixed(1)+'" transform="rotate(-90 36 36)" filter="url(#sh'+uid+')"/>'
      +'<text x="36" y="41" text-anchor="middle" font-size="13" font-weight="800" fill="'+INK+'" font-family="inherit">'+Math.round(pct)+'%</text></svg>';
  }
  function tile(m, full){
    var done=m.idx.filter(function(i){return S.dn.has(i);}).length, tot=m.idx.length;
    var pct=Math.round(done/tot*100), complete=(done===tot), started=done>0;
    var col=lvlCol(m.level);

    if(full){
      var chipBg2=(m.level==='HL')?'rgba(180,83,9,.10)':'rgba(15,118,110,.10)';
      var gemBadgeFull=complete?'<div class="tile-gem-badge" style="width:44px;height:44px;top:-12px;right:-12px;">'+gemSVG(44)+'</div>':'';
      return '<button class="hub-tile '+(m.level==='HL'?'hl':'sl')+'" onclick="openModule(\''+m.key+'\')" style="position:relative;grid-column:1 / -1;display:flex;flex-direction:column;text-align:left;cursor:pointer;font-family:inherit;background:#fff;border:2.5px solid #f0b429;border-radius:20px;padding:22px 26px;">'
        +gemBadgeFull
        +'<div style="font-size:16px;font-style:italic;font-weight:600;color:'+MUT+';margin-bottom:14px;">Unit: Microeconomics</div>'
        +'<div style="display:flex;align-items:center;gap:22px;">'
        +'<div style="width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;background:'+chipBg2+';">'+(m.chip||m.emoji)+'</div>'
        +ring(col,pct,96)
        +'<div style="min-width:0;">'
        +'<div style="font-size:30px;font-weight:800;color:'+INK+';line-height:1.2;">'+m.title+'</div>'
        +'<div style="font-size:23px;font-weight:800;color:'+col+';margin-top:7px;">'+m.level+' · '+status+'</div>'
        +'</div></div></button>';
    }
    var chipBg=(m.level==='HL')?'rgba(180,83,9,.10)':'rgba(15,118,110,.10)';
    var gemBadge=complete?'<div class="tile-gem-badge">'+gemSVG(38)+'</div>':'';
    return '<button class="hub-tile '+(m.level==='HL'?'hl':'sl')+'" onclick="openModule(\''+m.key+'\')" style="position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;font-family:inherit;background:#fff;border:2.5px solid #f0b429;border-radius:20px;padding:26px 16px 22px;">'
      +gemBadge

      +ring(col,pct,108)
      +'</div>'

      +'<div style="font-size:22px;font-weight:800;color:'+col+';margin-top:8px;">'+m.level+' · '+status+'</div>'
      +'</button>';
  }

  /* grid tiles: pairs of modules, with any final odd one full-width */
  var tiles='', i;
  for(i=0;i+1<MODULES.length;i+=2){ tiles+=tile(MODULES[i],false)+tile(MODULES[i+1],false); }
  if(i<MODULES.length){ tiles+=tile(MODULES[i],true); }

  var resumeTileHTML='';

    resumeTileHTML='<div onclick="resumeLastLesson()" style="cursor:pointer;background:#fff;border:2.5px solid '+SLC+';border-radius:18px;padding:20px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;">'
      +'<div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#fcfcfc 0%,#e8e8e6 100%);border:1px solid #c9c9c7;box-shadow:6px 10px 14px rgba(20,20,20,.28),2px 4px 6px rgba(20,20,20,.16),inset 0 2px 0 #ffffff,inset 0 -2px 0 #d2d2d0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">'
      +'<svg width="26" height="26" viewBox="0 0 26 26"><polygon points="6,3 22,13 6,23" fill="#1a1a1a"/></svg>'
      +'</div>'
      +'<div style="font-size:23px;font-weight:800;color:'+INK+';margin-top:12px;">Resume</div>'
      +'<div style="font-size:14px;font-weight:700;color:'+SLC+';margin-top:4px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+D[S.lastLes].t+'</div>'
      +'</div>';
  }

  var overallPct=Math.round(totalDone/totalLes*100);
  var acct='';
  if(sb&&CLOUD.user){
    acct='<div style="display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-bottom:6px;font-size:19px;color:'+MUT+';">'
      +'<span>👤 '+(CLOUD.user.email||'signed in')+'</span>'
      +'<button onclick="doSignOut()" style="background:none;border:1px solid '+TILEBORDER+';border-radius:10px;font-family:inherit;font-size:18px;font-weight:700;color:'+MUT+';padding:6px 14px;cursor:pointer;">Sign out</button></div>';
  } else if(sb){

function sL(i){
  S.les=i;S.qi=0;S.sel=null;S.sub=false;S.cor=null;S.sc=0;S.lessilver=0;S.mistake=false;S.hintLevel=0;
  S.answers=[];S.view=0;

  S.lastLes=i; saveProgress();

/* Jump straight back into the lesson the student last opened (hub Resume tile) */
function resumeLastLesson(){
  if(typeof S.lastLes!=='number'||!D[S.lastLes])return;
  S.curMod=D[S.lastLes].mod;
  sL(S.lastLes);
  if(window.scrollTo)window.scrollTo(0,0);
}

  /* derive display state: live question uses S.*, past questions use stored answers */
  var subbed=live?S.sub:true;
  var sel=live?S.sel:(S.answers&&S.answers[vi]?S.answers[vi].sel:null);
  var cor=live?S.cor:(S.answers&&S.answers[vi]?S.answers[vi].cor:null);

  var qH='';

  if(q.tp==='mc'||q.tp==='calc'){

    var cb=(q.tp==='calc'&&NUMBERED_DIAGRAMS.indexOf(q.g)<0)?'<div class="cbox">'+q.f.map(function(f){return '<div><span style="color:#7a90b8;font-weight:500;">'+f[0]+':</span> <span style="color:#f0b429;font-weight:800;">'+f[1]+'</span></div>';}).join('')+'</div>':'';
    var opts=q.o.map(function(o,i){
      var c='opt';
      if(subbed){if(i===q.a)c+=' ok';else if(i===sel&&!cor)c+=' ng';}
      else if(sel===i)c+=' sel';
      return '<button class="'+c+'" onclick="selA('+i+')" '+(subbed?'disabled':'')+'><span class="olet">'+['A','B','C','D'][i]+'</span><span>'+o+'</span></button>';
    }).join('');

function goBack(){var vi=(S.view==null?S.qi:S.view);if(vi>0){S.view=vi-1;rGame();}}
function goFwd(){var vi=(S.view==null?S.qi:S.view);if(vi<S.qi){S.view=vi+1;rGame();}}

function selA(i){if(S.view===S.qi&&!S.sub){S.sel=i;rGame();}}
function hBtn(){if(!S.sub)subA();else nxt();}

function mPick(pid){
  if(S.view!==S.qi||S.sub)return;
  if(S.mPlaced[pid])return;
  S.mSel=(S.mSel===pid?null:pid);rGame();
}
function mDragStart(evt,pid){
  if(S.view!==S.qi||S.sub)return;
  S.mSel=pid;
  try{evt.dataTransfer.setData('text/plain',String(pid));evt.dataTransfer.effectAllowed='move';}catch(e){}
}
function mDrop(evt,defPid){
  evt.preventDefault();
  mTry(defPid);
}
function mTry(defPid){
  if(S.view!==S.qi||S.sub)return;
  if(S.mPlaced[defPid])return;
  var picked=S.mSel;
  if(picked==null)return;
  var q=D[S.les].qs[S.qi];
  if(picked===defPid){
    S.mPlaced[defPid]=true;S.mSel=null;playCorrect();
    if(Object.keys(S.mPlaced).length===q.pairs.length){mComplete();return;}
    rGame();
  } else {
    playWrong();
    S.mSel=null;
    if(!S.mMistake){
      S.mMistake=true;
      subSilver(20);
    }
    rGame();
    var el=document.getElementById('mdef-'+defPid);
    if(el){el.classList.add('shake');setTimeout(function(){el.classList.remove('shake');},400);}
  }
}
function mComplete(){
  S.sub=true;S.cor=!S.mMistake;
  S.answers[S.qi]={sel:null,cor:S.cor};
  if(S.cor){S.sc++;playCorrect();addSilver(10);popCoin();}
  rGame();
}

function subA(){
  var q=D[S.les].qs[S.qi];
  if(q.tp==='match')return;
  S.sub=true;S.cor=(S.sel===q.a);
  S.answers[S.qi]={sel:S.sel,cor:S.cor};
  if(S.cor){S.sc++;playCorrect();addSilver(10);popCoin();}
  else{
    playWrong();S.mistake=true;
    subSilver(20);
  }
  rGame();
  if(!S.cor){var fb=document.getElementById('fb-ng');if(fb){fb.classList.add('shake');setTimeout(function(){fb.classList.remove('shake');},400);}}
}

function nxt(){
  var les=D[S.les];
  if(S.qi===les.qs.length-1){fin();return;}
  S.qi++;S.view=S.qi;S.sel=null;S.sub=false;S.cor=null;S.hintLevel=0;
  S.mPlaced={};S.mMistake=false;S.mTermOrder=null;S.mDefOrder=null;S.mSel=null;
  rGame();
}

function fin(){
  var modKey=D[S.les].mod;
  var wasComplete=moduleComplete(modKey);
  S.dn.add(S.les);
  if(!S.mistake)S.perfect.add(S.les);
  var tot=D[S.les].qs.length;
  var pct=Math.round(S.sc/tot*100);
  S.acc[S.les]=Math.max(S.acc[S.les]||0,pct);
  saveProgress();
  var newDiamond=(!wasComplete&&moduleComplete(modKey));
  if(pct>=60){showCelebration(!S.mistake&&S.sc===tot);}
  else{sw('res');rRes();}
  if(newDiamond){
    var modObj=MODULES.filter(function(x){return x.key===modKey;})[0];
    setTimeout(function(){showDiamondFlash(modObj?modObj.title:'Module');},1300);
  }
}

function gH(){
  sw('home');rHome();
  /* return to where the player was on the map, not the top.
     Defer to the next frame(s) so the freshly-shown map is laid out first. */
  var target=S.les;
  function doScroll(){
    var el=document.getElementById('les-'+target);
    if(!el) return;
    try{
      el.scrollIntoView({block:'center'});
    }catch(e){
      var y=el.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0)-(window.innerHeight/2);
      window.scrollTo(0,Math.max(0,y));
    }
  }
  if(window.requestAnimationFrame){
    requestAnimationFrame(function(){ requestAnimationFrame(doScroll); });
  }else{
    setTimeout(doScroll,60);
  }
}

function joinChallengeChannel(){
  var myId=(CLOUD.user&&CLOUD.user.id)?CLOUD.user.id:('guest_'+Math.random().toString(36).slice(2,8));
  CHALLENGE.channel=sb.channel('challenge_'+CHALLENGE.code,{config:{presence:{key:myId}}});
  CHALLENGE.channel
    .on('presence',{event:'sync'},function(){
      var state=CHALLENGE.channel.presenceState();
      var keys=Object.keys(state);
      CHALLENGE.oppPresent=keys.length>1;
      if(CHALLENGE.role==='host'&&CHALLENGE.oppPresent&&!CHALLENGE.order){
        var pool=getSpeedPoolFor(CHALLENGE.speedType);
        CHALLENGE.order=shuffle(pool.map(function(_,i){return i;}));
        sendChallengeMsg('order',{order:CHALLENGE.order,speedType:CHALLENGE.speedType});
      }
      rChallengeLobby();
    })
    .on('broadcast',{event:'order'},function(msg){ CHALLENGE.order=msg.payload.order; CHALLENGE.speedType=msg.payload.speedType; rChallengeLobby(); })
    .on('broadcast',{event:'ready'},function(msg){ CHALLENGE.oppReady=true; rChallengeLobby(); checkBothReady(); })
    .on('broadcast',{event:'start'},function(msg){ CHALLENGE.startAt=msg.payload.startAt; scheduleChallengeStart(); })
    .on('broadcast',{event:'progress'},function(msg){ CHALLENGE.oppProgress=msg.payload; if(S.sactive)rSpeed(); })
    .on('broadcast',{event:'finish'},function(msg){ CHALLENGE.oppFinished=true; CHALLENGE.oppFinal=msg.payload; maybeShowChallengeResults(); })
    .subscribe(function(status){
      if(status==='SUBSCRIBED'){
        CHALLENGE.channel.track({joined:true});
        rChallengeLobby();
      } else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
        showChallengeError('Connection lost. Please try again.');
      }
    });
  rChallengeLobby();
}

function getSpeedPool(){
  if(S.speedType==='peds') return PED_SORT_QS;
  if(S.speedType==='pedc') return PED_SPEED_QS;
  if(S.speedType==='pess') return PES_SORT_QS;
  if(S.speedType==='hls') return HL_SORT_QS;
  if(S.speedType==='hlc') return HL_SPEED_QS;
  if(S.speedType==='hss') return HS_SORT_QS;
  if(S.speedType==='hsc') return HS_SPEED_QS;
  if(S.speedType==='mes') return ME_SORT_QS;
  if(S.speedType==='mec') return ME_SPEED_QS;
  if(S.speedType==='mhs') return MH_SORT_QS;
  if(S.speedType==='mhc') return MH_SPEED_QS;
  if(S.speedType==='gvs') return GV_SORT_QS;
  if(S.speedType==='gvc') return GV_SPEED_QS;
  if(S.speedType==='ghs') return GH_SORT_QS;
