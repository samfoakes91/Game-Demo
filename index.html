function updateSTimer(){
  var el=document.getElementById('timer-num'),ring=document.getElementById('timer-ring');
  if(!el||!ring)return;
  var tot=S.stimeTotal||60;
  var t=S.stimeLeft,col=t>tot/2?'#00c4a7':t>tot/6?'#f0b429':'#ff5555';
  el.textContent=t;el.style.color=col;
  var c=2*Math.PI*28;
  ring.style.strokeDashoffset=c*(1-t/tot);ring.style.stroke=col;
}

function rSpeed(){
  if(!S.sactive)return;
  var pool=getSpeedPool();
  if(S.sqIdx>=S.sq.length){S.sq=shuffle(pool.map(function(_,i){return i;}));S.sqIdx=0;}
  var stTot=S.stimeTotal||60;
  var t=S.stimeLeft,col=t>stTot/2?'#00c4a7':t>stTot/6?'#f0b429':'#ff5555';
  var ringC=2*Math.PI*28;
  var labels={peds:'⚡ Classify Demand — Speed Round',pedc:'⚡ PED Calculations — Speed Round',pess:'⚡ Classify Supply — Speed Round',pesc:'⚡ PES Calculations — Speed Round',hls:'⚡ Read the Curve — Speed Round',hlc:'⚡ Revenue & MR — Speed Round',hss:'⚡ Primary or Manufactured? — Speed Round',hsc:'⚡ PES & Comparison — Speed Round',mes:'⚡ Shortage or Surplus? — Speed Round',mec:'⚡ Equilibrium Effects — Speed Round',mhs:'⚡ CS or PS? — Speed Round',mhc:'⚡ Surplus Calculations — Speed Round',gvs:'⚡ Ceiling or Floor? — Speed Round',gvc:'⚡ Intervention Effects — Speed Round',ghs:'⚡ Tax or Subsidy? — Speed Round',ghc:'⚡ Government Calculations — Speed Round',bef:'⚡ Vocabulary Flashcards — Speed Round',pgx:'⚡ Excludable or Not? — Speed Round',pgr:'⚡ Rivalrous or Not? — Speed Round',ais:'⚡ Adverse Selection or Moral Hazard? — Speed Round',air:'⚡ Government or Private Response? — Speed Round'};
  var typeLabel=labels[S.speedType]||'⚡ Speed Round';

  var header='<div class="topbar">'
    +'<button onclick="endSpeed()" class="map-btn">🗺 Return to Module</button>'
    +'<div style="flex:1;">'
    +'<div style="font-size:11px;color:#f0b429;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;">'+typeLabel+'</div>'
    +'<div style="font-size:12px;color:#7a90b8;">'+S.sanswered+' answered &nbsp;·&nbsp; ✓ '+S.scorrect+' correct</div>'
    +(CHALLENGE.active?'<div style="font-size:11px;color:#a78bfa;margin-top:2px;">⚔️ Opponent: ✓ '+CHALLENGE.oppProgress.correct+' correct</div>':'')
    +'</div>'
    +'<div class="timer-ring-wrap">'
    +'<svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="28" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>'
    +'<circle id="timer-ring" cx="35" cy="35" r="28" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="round" style="stroke-dasharray:'+ringC+';stroke-dashoffset:'+(ringC*(1-t/stTot))+';transition:stroke-dashoffset .95s linear,stroke .5s;"/></svg>'
    +'<div class="timer-num" id="timer-num" style="color:'+col+';">'+t+'</div>'
    +'</div></div>';

  var body='';
  var isSortType=(S.speedType==='peds'||S.speedType==='pess'||S.speedType==='hls'||S.speedType==='hss'||S.speedType==='mes'||S.speedType==='mhs'||S.speedType==='gvs'||S.speedType==='ghs'||S.speedType==='pgx'||S.speedType==='pgr'||S.speedType==='ais'||S.speedType==='air');
  var isFlashType=(S.speedType==='bef');

  if(isFlashType){
    var qf=pool[S.sq[S.sqIdx]];
    if(!S.flashOpts){S.flashOpts=(Math.random()<0.5)?[qf.term,qf.distractor]:[qf.distractor,qf.term];}
    var answered=S.scurSub;
    var wasCor=answered&&(S.flashOpts[S.flashPicked]===qf.term);
    var cardBorder=!answered?'rgba(255,255,255,.1)':(wasCor?'rgba(0,196,167,.5)':'rgba(240,180,41,.5)');
    var cardInner=!answered
      ?('<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#7a90b8;margin-bottom:14px;">Which term matches this definition?</div>'
        +'<div style="font-size:19px;font-weight:700;color:#fff;line-height:1.5;">'+qf.def+'</div>')
      :('<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:'+(wasCor?'#00c4a7':'#f0b429')+';margin-bottom:10px;">'+(wasCor?'✅ Correct!':'🔄 The correct term is')+'</div>'
        +'<div style="font-size:25px;font-weight:900;color:#fff;margin-bottom:12px;">'+qf.term+'</div>'
        +'<div style="font-size:13px;color:#8a97b8;line-height:1.5;">'+qf.def+'</div>');
    body='<div class="fade-in" style="background:#152038;border:1.5px solid '+cardBorder+';border-radius:16px;padding:28px 24px;margin-bottom:16px;min-height:170px;display:flex;flex-direction:column;justify-content:center;text-align:center;">'+cardInner+'</div>';
    var letters2=['A','B'];
    body+='<div class="opts">'+S.flashOpts.map(function(term,idx){
      var isCorTerm=(term===qf.term),picked=(S.flashPicked===idx);
      var c='opt';
      if(answered){if(isCorTerm)c+=' ok';else if(picked)c+=' ng';}
      return '<button class="'+c+'" onclick="fPick('+idx+')" '+(answered?'disabled':'')+'><span class="olet">'+letters2[idx]+'</span><span>'+term+'</span></button>';
    }).join('')+'</div>';
  } else if(isSortType){
    var q=pool[S.sq[S.sqIdx]];S.scurSub=false;
    var sections=S.speedType==='peds'?PED_DEGREES:S.speedType==='hls'?HL_CURVE_DEGREES:S.speedType==='hss'?HS_PM_CATS:S.speedType==='mes'?ME_SS_CATS:S.speedType==='mhs'?MH_SS_CATS:S.speedType==='gvs'?GV_CF_CATS:S.speedType==='ghs'?GH_TS_CATS:S.speedType==='pgx'?PG_EXCL_CATS:S.speedType==='pgr'?PG_RIVAL_CATS:S.speedType==='ais'?AI_SEL_CATS:S.speedType==='air'?AI_RESP_CATS:PES_DEGREES;
    var prompt=S.speedType==='peds'?'Which type of demand elasticity is this?':S.speedType==='hls'?'Elastic, unit elastic, or inelastic?':S.speedType==='hss'?'Primary commodity or manufactured product?':S.speedType==='mes'?'Shortage or surplus?':S.speedType==='mhs'?'Consumer surplus or producer surplus?':S.speedType==='gvs'?'Price ceiling or price floor?':S.speedType==='ghs'?'Indirect tax or subsidy?':S.speedType==='pgx'?'Excludable or non-excludable?':S.speedType==='pgr'?'Rivalrous or non-rivalrous?':S.speedType==='ais'?'Adverse selection or moral hazard?':S.speedType==='air'?'Government response or private response?':'Which type of supply elasticity is this?';
    body='<div class="fade-in" style="background:#152038;border:1.5px solid rgba(255,255,255,.1);border-radius:16px;padding:22px 20px 24px;margin-bottom:18px;">'
      +'<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#7a90b8;margin-bottom:12px;">'+prompt+'</div>'
      +'<div style="font-size:26px;font-weight:900;color:#fff;line-height:1.3;">'+q.acc+'</div></div>';
    sections.forEach(function(sec,i){
      var st=S.soptSt[i];
      var border=st==='ok'?'#00c4a7':st==='ng'?'#ff5555':'rgba(255,255,255,.1)';
      var bg=st==='ok'?'rgba(0,196,167,.15)':st==='ng'?'rgba(255,85,85,.15)':'#152038';
      var dotCol=st==='ok'?'#00c4a7':st==='ng'?'#ff5555':'rgba(255,255,255,.2)';
      body+='<button class="sopt'+(st?' '+st:'')+'" onclick="sSel('+i+',event)" '+(S.scurSub?'disabled':'')+' style="border-color:'+border+';background:'+bg+';">'
        +'<span class="sdot" style="background:'+dotCol+';"></span><span>'+sec+'</span></button>';
    });
  } else {
    var q=pool[S.sq[S.sqIdx]];S.scurSub=false;
    var figHTML='';
    if(q.f){
      for(var fi=0;fi<q.f.length;fi++){
        figHTML+='<div style="font-size:14px;margin:3px 0;"><span style="color:#7a90b8;font-weight:500;">'+q.f[fi][0]+':</span> <span style="color:#f0b429;font-weight:800;">'+q.f[fi][1]+'</span></div>';
      }
      figHTML='<div style="margin-top:12px;">'+figHTML+'</div>';
    }
    body='<div class="fade-in" style="background:#152038;border:1.5px solid rgba(255,255,255,.1);border-radius:16px;padding:22px 20px 24px;margin-bottom:18px;">'
      +qLabelHTML(q.lb,12,'.1em')
      +'<div style="font-size:20px;font-weight:700;color:#fff;line-height:1.5;">'+q.q+'</div>'
      +figHTML+'</div>';
  }

  body+='<div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:11px 16px;background:#152038;border-radius:12px;border:1px solid rgba(255,255,255,.06);">'
    +'<div style="font-size:12px;color:#7a90b8;font-weight:600;">'+(isFlashType?'Pick the matching term — fast!':'Tap the correct answer — fast!')+'</div>'
    +'<div class="coin-pill" style="font-size:11px;padding:4px 10px;">'+coinPillHTML()+'</div>'
    +'</div>';

  document.getElementById('sc-speed').innerHTML=header+body;

  /* Inject MC buttons for IS / calc rounds */
  if(!isSortType&&!isFlashType){
    var q2=pool[S.sq[S.sqIdx]];
    var letters=['A','B','C','D'];
    var container=document.getElementById('sc-speed');
    var footer=container.lastElementChild;
    for(var oi=0;oi<q2.o.length;oi++){
      var st2=S.soptSt[oi];
      var isOk=st2==='ok',isNg=st2==='ng';
      var btn=document.createElement('button');
      btn.style.cssText='width:100%;text-align:left;padding:13px 16px;background:'+(isOk?'rgba(0,196,167,.15)':isNg?'rgba(255,85,85,.15)':'#152038')+';border:2px solid '+(isOk?'#00c4a7':isNg?'#ff5555':'rgba(255,255,255,.1)')+';color:#fff;border-radius:13px;cursor:'+(S.scurSub?'not-allowed':'pointer')+';font-size:14px;font-family:inherit;font-weight:500;display:flex;align-items:center;gap:11px;margin-bottom:9px;transition:all .15s;';
      if(S.scurSub)btn.disabled=true;
      (function(idx){btn.addEventListener('click',function(e){sSel(idx,e);});})(oi);
      var letSpan=document.createElement('span');
      letSpan.style.cssText='width:28px;height:28px;border-radius:7px;background:'+(isOk?'rgba(0,196,167,.3)':isNg?'rgba(255,85,85,.3)':'rgba(255,255,255,.1)')+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:'+(isOk?'#00c4a7':isNg?'#ff5555':'#7a90b8')+';flex-shrink:0;min-width:28px;';
      letSpan.textContent=letters[oi];
      var txtSpan=document.createElement('span');
      txtSpan.textContent=q2.o[oi];
      btn.appendChild(letSpan);btn.appendChild(txtSpan);
      container.insertBefore(btn,footer);
    }
  }
}

function sSel(i,evt){
  if(S.scurSub||!S.sactive)return;
  S.scurSub=true;
  var pool=getSpeedPool();
  var q=pool[S.sq[S.sqIdx]];
  var cor=i===q.a;
  S.sanswered++;
  if(cor){S.scorrect++;addSilver(S.speedReward);playCorrect();}  /* 2 on first play, 1 on replays */
  else{playWrong();}
  var ns={};
  var isSortType=(S.speedType==='peds'||S.speedType==='pess'||S.speedType==='hls'||S.speedType==='hss'||S.speedType==='mes'||S.speedType==='mhs'||S.speedType==='gvs'||S.speedType==='ghs'||S.speedType==='pgx'||S.speedType==='pgr'||S.speedType==='ais'||S.speedType==='air');
  var len=isSortType?(S.speedType==='peds'?PED_DEGREES.length:S.speedType==='hls'?HL_CURVE_DEGREES.length:S.speedType==='hss'?HS_PM_CATS.length:S.speedType==='mes'?ME_SS_CATS.length:S.speedType==='mhs'?MH_SS_CATS.length:S.speedType==='gvs'?GV_CF_CATS.length:S.speedType==='ghs'?GH_TS_CATS.length:S.speedType==='pgx'?PG_EXCL_CATS.length:S.speedType==='pgr'?PG_RIVAL_CATS.length:S.speedType==='ais'?AI_SEL_CATS.length:S.speedType==='air'?AI_RESP_CATS.length:PES_DEGREES.length):4;
  for(var j=0;j<len;j++){
    if(j===q.a)ns[j]='ok';
    else if(j===i&&!cor)ns[j]='ng';
  }
  S.soptSt=ns;
  rSpeed();
  broadcastChallengeProgress();
  if(evt)scoreFlash(cor,evt.clientX-20,evt.clientY-30);
  setTimeout(function(){
    if(!S.sactive)return;
    S.sqIdx++;S.soptSt={};S.scurSub=false;rSpeed();
  },cor?480:880);
}

function fPick(idx){
  if(S.scurSub||!S.sactive)return;
  S.scurSub=true;S.sanswered++;
  var pool=getSpeedPool();
  var qf=pool[S.sq[S.sqIdx]];
  var cor=(S.flashOpts[idx]===qf.term);
  S.flashPicked=idx;
  if(cor){S.scorrect++;addSilver(S.speedReward);playCorrect();}
  else{playWrong();}
  rSpeed();
  broadcastChallengeProgress();
  setTimeout(function(){
    if(!S.sactive)return;
    S.sqIdx++;S.scurSub=false;S.flashOpts=null;S.flashPicked=null;rSpeed();
  },cor?1750:2300);
}

function endSpeed(){
  S.sactive=false;
  if(S.stimer){clearInterval(S.stimer);S.stimer=null;}
  if(CHALLENGE.active){
    CHALLENGE.myFinished=true;
    CHALLENGE.myFinal={correct:S.scorrect,answered:S.sanswered};
    sendChallengeMsg('finish',CHALLENGE.myFinal);
    sw('challenge');
    if(CHALLENGE.oppFinished){
      rChallengeResults();
    } else {
      document.getElementById('sc-challenge').innerHTML=
        '<div style="text-align:center;padding:60px 10px;">'
        +'<div style="font-size:15px;color:#7a90b8;margin-bottom:10px;">You scored <b style="color:#fff;">'+S.scorrect+'</b> correct!</div>'
        +'<div style="font-size:13px;color:#7a90b8;margin-bottom:20px;">Waiting for your opponent to finish\u2026</div>'
        +'<button class="btn ghost" onclick="leaveChallenge()">'+(CHALLENGE.fromHub?'Return to Landing Page':'Return to Module')+'</button>'
        +'</div>';
    }
    return;
  }
  sw('sres');rSRes();
}

function rSRes(){
  var pct=S.sanswered>0?Math.round(S.scorrect/S.sanswered*100):0;
  var medal=S.scorrect>=15?'🏆':S.scorrect>=10?'⭐':S.scorrect>=5?'🎯':'📚';
  var msg=S.scorrect>=15?'Outstanding!':S.scorrect>=10?'Great Speed!':S.scorrect>=5?'Good Effort!':'Keep Practising!';
  var labels={peds:'Classify Demand',pedc:'PED Calculations',pess:'Classify Supply',pesc:'PES Calculations',hls:'Read the Curve',hlc:'Revenue & MR',hss:'Primary or Manufactured?',hsc:'PES & Comparison',mes:'Shortage or Surplus?',mec:'Equilibrium Effects',mhs:'CS or PS?',mhc:'Surplus Calculations',gvs:'Ceiling or Floor?',gvc:'Intervention Effects',ghs:'Tax or Subsidy?',ghc:'Government Calculations',bef:'Vocabulary Flashcards',pgx:'Excludable or Not?',pgr:'Rivalrous or Not?',ais:'Adverse Selection or Moral Hazard?',air:'Government or Private Response?'};
  var typeLabel=labels[S.speedType]||'Speed Round';
  document.getElementById('sc-sres').innerHTML=
    '<div style="text-align:center;padding:28px 0 18px;">'
    +'<div class="rcircle">'+medal+'</div>'
    +'<div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:5px;">'+msg+'</div>'
    +'<div style="font-size:13px;color:#7a90b8;margin-bottom:4px;">'+typeLabel+' — Speed Round</div>'
    +'<div style="font-size:12px;color:#f0b429;font-weight:700;">⏱️ 60 seconds</div>'
    +'</div>'
    +'<div class="sts">'
    +'<div class="st"><div class="sv">'+S.scorrect+'</div><div class="sl">Correct</div></div>'
    +'<div class="st"><div class="sv">'+S.sanswered+'</div><div class="sl">Answered</div></div>'
    +'<div class="st"><div class="sv">'+pct+'%</div><div class="sl">Accuracy</div></div>'
    +'</div>'
    +'<div style="background:#152038;border-radius:13px;border:1px solid rgba(255,255,255,.08);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;">'
    +'<div style="font-size:13px;color:#7a90b8;font-weight:600;">Coins earned</div>'
    +'<div style="font-size:14px;font-weight:800;color:'+(S.lessilver>0?'#00c4a7':S.lessilver<0?'#ff5555':'#b0c4de')+';">'+(S.lessilver>=0?'+':'')+S.lessilver+' 🪙</div>'
    +'</div>'
    +'<div style="background:#152038;border-radius:13px;border:1px solid rgba(255,255,255,.08);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;">'
    +'<div style="font-size:13px;color:#7a90b8;font-weight:600;">Your Coinage</div>'
    +'<div class="coin-pill">'+coinPillHTML()+'</div>'
    +'</div>'
    +'<button class="btn teal-btn" onclick="beginSpeedRound(\''+S.speedType+'\')">Play Again ⚡</button>'
    +'<button class="btn ghost" onclick="gH()">Return to Module</button>';
}

/* ===================== INIT ===================== */
function resetProgress(){
  var signedIn = !!(CLOUD.user && CLOUD.user.email);
  var body = signedIn
    ? '<div style="font-size:13px;color:#7a90b8;line-height:1.5;margin-bottom:16px;">Enter your account password to confirm. Progress and coins cannot be recovered.</div>'
      +'<input id="rc-input" type="password" placeholder="Password" style="width:100%;padding:13px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:#152038;color:#fff;font-size:15px;font-family:inherit;margin-bottom:6px;">'
      +'<div id="rc-err" style="font-size:12px;color:#ff5d7d;min-height:16px;margin-bottom:8px;"></div>'
    : '<div style="font-size:13px;color:#7a90b8;line-height:1.5;margin-bottom:16px;">Type <b style="color:#fff;">RESET</b> to confirm. Progress and coins cannot be recovered.</div>'
      +'<input id="rc-input" type="text" placeholder="Type RESET" autocapitalize="off" autocomplete="off" style="width:100%;padding:13px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:#152038;color:#fff;font-size:15px;font-family:inherit;margin-bottom:6px;">'
      +'<div id="rc-err" style="font-size:12px;color:#ff5d7d;min-height:16px;margin-bottom:8px;"></div>';
  document.getElementById('reset-confirm').innerHTML =
    '<div class="reset-card">'
    +'<div style="font-size:18px;font-weight:800;color:#ff5d7d;margin-bottom:6px;">⚠️ Reset all progress?</div>'
    +body
    +'<div style="display:flex;gap:10px;">'
    +'<button onclick="closeResetConfirm()" style="flex:1;padding:12px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:none;color:#c0cfe8;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;">Cancel</button>'
    +'<button id="rc-confirm-btn" onclick="submitResetConfirm()" style="flex:1;padding:12px;border-radius:11px;border:none;background:#ff5d7d;color:#0a1628;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;">Reset</button>'
    +'</div></div>';
  document.getElementById('reset-confirm').classList.add('show');
  setTimeout(function(){var el=document.getElementById('rc-input');if(el)el.focus();},50);
}
function closeResetConfirm(){
  document.getElementById('reset-confirm').classList.remove('show');
  document.getElementById('reset-confirm').innerHTML='';
}
/* Wipes all persisted progress back to a blank slate — used both by the
   manual "Reset all progress" button and by sign-out, so that one signed-in
   user's progress can never bleed into the next person who uses this device. */
function resetLocalProgress(){
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  S.dn=new Set();S.perfect=new Set();S.gold=0;S.silver=0;S.splays={};S.acc={};S.lastLes=null;
}
function doActualReset(){
  resetLocalProgress();
  closeResetConfirm();
  rHome();rHub();
}
function submitResetConfirm(){
  var val=(document.getElementById('rc-input').value||'');
  var errEl=document.getElementById('rc-err');
  var btn=document.getElementById('rc-confirm-btn');
  var signedIn = !!(CLOUD.user && CLOUD.user.email);
  if(signedIn){
    if(!val){errEl.textContent='Please enter your password.';return;}
    if(!sb){errEl.textContent='Not connected — please try again.';return;}
    btn.disabled=true; btn.textContent='Checking…';
    sb.auth.signInWithPassword({email:CLOUD.user.email,password:val}).then(function(r){
      if(r.error){errEl.textContent='Incorrect password.';btn.disabled=false;btn.textContent='Reset';return;}
      doActualReset();
    });
  } else {
    if(val.trim().toUpperCase()!=='RESET'){errEl.textContent='Please type RESET exactly to confirm.';return;}
    doActualReset();
  }
}

loadProgress();
rHome();
rHub();
(function boot(){
  if(!sb){ return; }                       /* not configured: guest-only, straight to hub */
  sb.auth.getSession().then(function(r){
    var sess=r&&r.data&&r.data.session;
    if(sess){ CLOUD.user=sess.user; cloudLoadAndEnter(); }
    else { sw('login'); rLogin(); }
  },function(){ /* network issue: stay on hub as guest */ });
})();
</script>
