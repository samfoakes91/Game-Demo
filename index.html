<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>IB Economics SL — Microeconomics: Elasticity</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a1628;color:#fff;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px}
html,body{overflow-x:hidden}
body.hub-light{background:#e6f0fb;}
.hub-tile{transition:all .16s ease;}
.hub-tile:hover{box-shadow:0 4px 16px rgba(24,34,52,.10);transform:translateY(-2px);}
.hub-tile:active{transform:translateY(0);box-shadow:0 1px 4px rgba(24,34,52,.08);}
.hub-tile.sl:hover{background:#e3f4f1 !important;border-color:#0f766e !important;}
.hub-tile.hl:hover{background:#fdeedd !important;border-color:#b45309 !important;}
#app{width:100%;max-width:600px;position:relative}
/* ── Landing page (hub) keeps the wide desktop layout ── */
@media (min-width:900px){
  body.hub-light #app{max-width:1040px}
  .hub-grid{grid-template-columns:1fr 1fr 1fr !important}
  .hub-tile svg{width:118px;height:118px}
}
@media (min-width:1280px){
  body.hub-light #app{max-width:1220px}
  .hub-tile svg{width:132px;height:132px}
}
/* ── All other screens: original 600px caps, scaled up on big screens ── */
@media (min-width:700px){ body:not(.hub-light){zoom:1.15} }
@media (min-width:1100px){ body:not(.hub-light){zoom:1.3} }
@media (min-width:1600px){ body:not(.hub-light){zoom:1.45} }
.sc{display:none}.sc.on{display:block}

.btn{border:none;cursor:pointer;border-radius:12px;font-weight:700;font-family:inherit;font-size:15px;transition:all .15s;width:100%;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.gold-btn{background:#f0b429;color:#0a1628;border-bottom:4px solid #b8820a}
.gold-btn:hover{background:#e6a817}
.gold-btn:active{transform:translateY(2px);border-bottom-width:2px}
.gold-btn:disabled{background:#1a2d50;color:#3a5078;border-bottom-color:#111f38;cursor:not-allowed;transform:none}
.teal-btn{background:#00c4a7;color:#0a1628;border-bottom:4px solid #009e86}
.teal-btn:hover{background:#00b398}
.teal-btn:active{transform:translateY(2px);border-bottom-width:2px}
.ghost{background:transparent;color:#7a90b8;border:1.5px solid #2a4070;margin-top:10px}
.ghost:hover{border-color:#7a90b8;color:#fff}

.opt{width:100%;text-align:left;padding:13px 16px;background:#152038;border:2px solid rgba(255,255,255,.1);color:#fff;border-radius:13px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:11px;margin-bottom:9px}
.opt:hover:not([disabled]){border-color:#f0b429;background:#1c2d4a}
.opt.sel{border-color:#f0b429;background:rgba(240,180,41,.1)}
.opt.ok{border-color:#00c4a7;background:rgba(0,196,167,.15)}
.opt.ng{border-color:#ff5555;background:rgba(255,85,85,.15)}
.opt[disabled]{cursor:not-allowed}
.olet{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#7a90b8;flex-shrink:0;min-width:28px}
.opt.sel .olet{background:rgba(240,180,41,.3);color:#f0b429}
.opt.ok .olet{background:rgba(0,196,167,.3);color:#00c4a7}
.opt.ng .olet{background:rgba(255,85,85,.3);color:#ff5555}

.chip{padding:9px 16px;background:#152038;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;margin:4px;display:inline-block}
.chip:hover:not([disabled]){border-color:#f0b429;background:#1c2d4a}
.chip.sel{border-color:#f0b429;background:rgba(240,180,41,.15);color:#f0b429}
.chip.ok{border-color:#00c4a7;background:rgba(0,196,167,.15);color:#00c4a7}
.chip.ng{border-color:#ff5555;background:rgba(255,85,85,.1);color:#ff5555}
.chip[disabled]{cursor:not-allowed}

.sopt{width:100%;text-align:left;padding:13px 16px;background:#152038;border:2px solid rgba(255,255,255,.1);color:#fff;border-radius:13px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;transition:all .12s;display:flex;align-items:center;gap:11px;margin-bottom:9px}
.sopt:hover:not([disabled]){border-color:#f0b429;background:#1c2d4a;transform:translateX(3px)}
.sopt.ok{border-color:#00c4a7;background:rgba(0,196,167,.15);transform:none}
.sopt.ng{border-color:#ff5555;background:rgba(255,85,85,.15);transform:none}
.sopt[disabled]{cursor:not-allowed}
.sdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);flex-shrink:0}
.sopt.ok .sdot{background:#00c4a7}
.sopt.ng .sdot{background:#ff5555}

.hp-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
.hp-bar-bg{height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.hp-bar-fill{height:100%;border-radius:99px;transition:width .5s ease,background .5s ease}
.hp-label{font-size:10px;font-weight:700;text-align:right}
.prog{height:7px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;flex:1}
.pf{height:100%;background:#f0b429;border-radius:99px;transition:width .4s}

.fb{border-radius:13px;padding:14px 18px;margin-top:12px;display:flex;align-items:flex-start;gap:13px}
.fb.ok{background:rgba(0,196,167,.12);border:1.5px solid #00c4a7}
.fb.ng{background:rgba(255,85,85,.1);border:1.5px solid #ff5555}

.sts{display:flex;gap:9px;margin-bottom:20px}
.st{flex:1;background:#152038;border-radius:13px;border:1px solid rgba(255,255,255,.08);padding:13px;text-align:center}
.sv{font-size:22px;font-weight:800;color:#f0b429}
.sl{font-size:11px;color:#7a90b8;margin-top:3px;font-weight:600}

.coin-pill{background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.3);border-radius:99px;padding:5px 12px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;flex-shrink:0}
.gold-coin{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe97a,#f0b429 45%,#b8820a 80%,#7a5200 100%);box-shadow:0 1px 0 #7a5200,0 2px 4px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,230,.5);font-size:10px;font-weight:900;color:#7a5200;position:relative;flex-shrink:0;border:1.5px solid #c8900a}
.gold-coin::after{content:'';position:absolute;top:2px;left:4px;width:6px;height:3px;border-radius:50%;background:rgba(255,255,200,.45);transform:rotate(-30deg)}
.gold-coin-lg{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe97a,#f0b429 45%,#b8820a 80%,#7a5200 100%);box-shadow:0 6px 0 #7a5200,0 10px 28px rgba(0,0,0,.65),inset 0 3px 8px rgba(255,255,230,.65);border:3px solid #c8900a;position:relative;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#7a5200;text-shadow:0 2px 0 rgba(255,220,80,.7);margin:0 auto;animation:spinBounce .7s ease forwards}
.gold-coin-lg::after{content:'';position:absolute;top:12px;left:16px;width:24px;height:11px;border-radius:50%;background:rgba(255,255,200,.45);transform:rotate(-30deg)}

.cbox{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.2);border-radius:11px;padding:12px 16px;margin-bottom:18px}
.cbox div{font-size:14px;margin:3px 0}

.timer-ring-wrap{position:relative;width:70px;height:70px;flex-shrink:0}
.timer-ring-wrap svg{transform:rotate(-90deg)}
.timer-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;transition:color .5s}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-top:8px}
.rcircle{width:84px;height:84px;border-radius:50%;background:rgba(240,180,41,.12);border:3px solid #f0b429;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 14px}

/* Module divider label */
.mod-label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;padding:3px 10px;border-radius:99px;display:inline-block;margin-bottom:6px}
.mod-fa{background:rgba(0,196,167,.15);color:#00c4a7;border:1px solid rgba(0,196,167,.3)}
.mod-ra{background:rgba(206,130,255,.15);color:#ce82ff;border:1px solid rgba(206,130,255,.3)}
.mod-hl{background:rgba(245,166,35,.15);color:#f5a623;border:1px solid rgba(245,166,35,.32)}
.mod-hs{background:rgba(242,102,139,.15);color:#f2668b;border:1px solid rgba(242,102,139,.34)}
.mod-me{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.34)}
.mod-mh{background:rgba(78,168,255,.15);color:#4ea8ff;border:1px solid rgba(78,168,255,.34)}
.mod-gv{background:rgba(250,204,21,.13);color:#facc15;border:1px solid rgba(250,204,21,.32)}
.mod-gh{background:rgba(34,211,238,.13);color:#22d3ee;border:1px solid rgba(34,211,238,.32)}

#gold-flash{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,22,40,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
#gold-flash.show{opacity:1;pointer-events:all}
.gf-title{font-size:26px;font-weight:800;color:#f0b429;margin-top:20px;letter-spacing:.02em}
.gf-sub{font-size:14px;color:#7a90b8;margin-top:8px}
.gf-coins{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:14px;font-weight:700}

#tl-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,12,28,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
#tl-overlay.show{opacity:1;pointer-events:all}
.tl-panel{background:#1a1a1a;border-radius:20px;padding:20px 30px 24px;border:3px solid #333;box-shadow:0 0 40px rgba(0,0,0,.8),inset 0 2px 4px rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;gap:12px}
.tl-bar{width:6px;height:18px;background:#111;border-radius:3px;margin-bottom:4px}
.tl-light{width:60px;height:60px;border-radius:50%;border:3px solid #111;transition:box-shadow .12s,background .12s;position:relative}
.tl-light::after{content:'';position:absolute;top:6px;left:8px;width:18px;height:10px;border-radius:50%;background:rgba(255,255,255,.15);transform:rotate(-30deg)}
.tl-red{background:#2a0a0a}.tl-red.on{background:#ff2200;box-shadow:0 0 22px 8px rgba(255,34,0,.75)}
.tl-orange{background:#2a1a00}.tl-orange.on{background:#ff8c00;box-shadow:0 0 22px 8px rgba(255,140,0,.75)}
.tl-green{background:#002a0a}.tl-green.on{background:#00e040;box-shadow:0 0 22px 8px rgba(0,224,64,.75)}
.tl-go{font-size:40px;font-weight:900;color:#00e040;letter-spacing:.1em;opacity:0;text-shadow:0 0 24px rgba(0,224,64,.9);transition:opacity .15s;margin-top:10px}
.tl-go.show{opacity:1}

#f1-container{position:fixed;bottom:70px;left:0;width:100%;pointer-events:none;z-index:1001;overflow:hidden;height:64px;opacity:0;transition:opacity .2s}
#f1-container.show{opacity:1}
#f1-car{position:absolute;left:-220px;bottom:0}
@keyframes f1Drive{0%{left:-220px}100%{left:110%}}
.f1-track-line{position:fixed;bottom:68px;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(240,180,41,.7) 30%,rgba(240,180,41,.7) 70%,transparent 100%);z-index:1000;opacity:0;transition:opacity .25s}
.f1-track-line.show{opacity:1}

@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.confetti-piece{position:fixed;top:-10px;pointer-events:none;z-index:9990;animation:confettiFall linear forwards}
#sc-celebrate{background:#0a1628;min-height:100vh;position:relative;overflow:hidden}

@keyframes spinBounce{0%{transform:scale(0) rotateY(180deg)}60%{transform:scale(1.25) rotateY(0deg)}80%{transform:scale(.95)}100%{transform:scale(1) rotateY(0deg)}}
@keyframes coinPop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}
.coin-pop{position:fixed;font-size:14px;font-weight:800;color:#b0c4de;pointer-events:none;animation:coinPop .9s ease forwards;z-index:998}
@keyframes scorePopAnim{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.score-flash{position:fixed;font-size:16px;font-weight:800;pointer-events:none;animation:scorePopAnim .7s ease forwards;z-index:998}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease}

/* HINT */
.hint-box{border-radius:12px;padding:12px 16px;margin-bottom:14px;border:1.5px solid rgba(206,130,255,.35);background:rgba(206,130,255,.08);display:flex;align-items:flex-start;gap:11px;animation:fadeIn .2s ease}
.hint-btn{border:none;cursor:pointer;border-radius:10px;font-weight:700;font-family:inherit;font-size:13px;padding:10px 16px;display:flex;align-items:center;gap:7px;transition:all .15s;background:rgba(206,130,255,.12);color:#ce82ff;border:1.5px solid rgba(206,130,255,.3);justify-content:space-between;box-sizing:border-box;min-height:46px;}
.hint-btn:hover:not([disabled]){background:rgba(206,130,255,.2);border-color:#ce82ff}
.hint-btn:disabled{opacity:.4;cursor:not-allowed}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================================================================
   LESSON DATA  (IB DP Economics SL — Microeconomics)
   DE = Demand Elasticity   (indices 0–5)  — mod:'fa' (teal)
   ES = Elasticity of Supply (indices 6–11) — mod:'ra' (purple)
   Each module's Lesson 0 (DE:0, ES:6) is always unlocked.
   Note: PED is mathematically negative; the absolute (positive)
   value is used throughout, per IB convention.
   ================================================================ */
var D=[
  /* ── DEMAND ELASTICITY ── */
  {t:'What is Elasticity?',ic:'📊',mod:'fa',qs:[
    {tp:'mc',lb:'Choose the correct answer',q:'What does elasticity measure in economics?',o:['How responsive one variable is to a change in another','The total quantity of a good sold in a market','The point where supply equals demand','The total revenue earned by a firm'],a:0},
    {tp:'mc',lb:'Choose the correct answer',q:'Price elasticity of demand (PED) measures the responsiveness of...',o:['quantity supplied to a change in price','quantity demanded to a change in price','quantity demanded to a change in income','price to a change in quantity demanded'],a:1},
    {tp:'mc',lb:'Choose the correct answer',q:'Income elasticity of demand (YED) measures the responsiveness of...',o:['quantity demanded to a change in consumer income','quantity supplied to a change in price','price to a change in demand','demand to a change in advertising'],a:0},
    {tp:'mc',lb:'Choose the correct answer',q:'If demand is described as "elastic", quantity demanded is...',o:['completely unresponsive to price changes','relatively unresponsive to price changes','relatively responsive to price changes','fixed regardless of price'],a:2},
    {tp:'mc',lb:'Choose the correct answer',q:'At Standard Level, the two elasticities OF DEMAND studied are...',o:['PED and PES','PED and YED','YED and PES','PED and XED'],a:1}
  ]},
  {t:'Price Elasticity of Demand I',ic:'🧮',mod:'fa',qs:[
    {tp:'blank',lb:'Fill in the blank',q:'Complete the PED formula:',s:'PED = % change in quantity demanded ÷ % change in _____',o:['Price','Income','Supply','Revenue'],a:0},
    {tp:'calc',lb:'Calculate and choose',q:'What is the price elasticity of demand (PED)?',f:[['% change in quantity demanded','−5%'],['% change in price','+10%']],o:['0.5','2','5','1.5'],a:0},
    {tp:'calc',lb:'Calculate and choose',q:'What is the price elasticity of demand (PED)?',f:[['% change in quantity demanded','+40%'],['% change in price','−20%']],o:['0.5','2','4','20'],a:1},
    {tp:'mc',lb:'Choose the correct answer',q:'Why is the PED value usually treated as positive, even though it is mathematically negative?',o:['Because price and quantity always move together','Because of the law of demand the sign is negative, so the absolute value is used','Because PED can never be calculated exactly','Because demand curves slope upward'],a:1},
    {tp:'calc',lb:'Calculate and choose',q:'Price rises from $4 to $5; quantity demanded falls from 100 to 90. What is the approximate PED?',f:[['Price','$4 → $5'],['Quantity demanded','100 → 90 units']],o:['0.4','2.5','0.25','4'],a:0}
  ]},
  {t:'Price Elasticity of Demand II',ic:'📐',mod:'fa',qs:[
    {tp:'mc',lb:'Choose the correct answer',q:'A good has a PED of 0.3. Demand for this good is...',o:['Price elastic','Price inelastic','Unit elastic','Perfectly elastic'],a:1},
    {tp:'mc',lb:'Choose the correct answer',q:'A good has a PED of 2.5. Demand for this good is...',o:['Price inelastic','Unit elastic','Price elastic','Perfectly inelastic'],a:2},
    {tp:'mc',lb:'Choose the correct answer',q:'If PED = 1, demand is described as...',o:['Perfectly inelastic','Unit elastic','Perfectly elastic','Relatively inelastic'],a:1},
    {tp:'blank',lb:'Fill in the blank',q:'Complete the statement:',s:'When PED = 0, demand is _____',o:['perfectly inelastic','perfectly elastic','unit elastic','relatively elastic'],a:0},
    {tp:'mc',lb:'Choose the correct answer',q:'Which good is MOST likely to have price inelastic demand?',o:['A luxury foreign holiday','One particular brand of soft drink','Insulin for a diabetic patient','A restaurant meal'],a:2}
  ]},

/* ===================== MODULE HUB (top-level picker) ===================== */
function rHub(){
  var totalDone=S.dn.size, totalLes=D.length;
  var SLC='#0f766e', HLC='#b45309';           /* SL = deep teal, HL = deep amber */
  var INK='#182234', MUT='#67718a', TILEBORDER='#d7e3f2', TRACK='#e2ebf7';
  function lvlCol(l){ return l==='HL'?HLC:SLC; }
  function ring(col,pct,size){
    var r=26,c=2*Math.PI*r,arc=(pct/100)*c;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 72 72" style="flex-shrink:0;">'
      +'<circle cx="36" cy="36" r="26" fill="none" stroke="'+TRACK+'" stroke-width="7"/>'
      +'<circle cx="36" cy="36" r="26" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+arc.toFixed(1)+' '+(c-arc).toFixed(1)+'" transform="rotate(-90 36 36)"/>'
      +'<text x="36" y="42" text-anchor="middle" font-size="17" font-weight="800" fill="'+INK+'" font-family="inherit">'+Math.round(pct)+'%</text></svg>';
  }
  function tile(m, full){
    var done=m.idx.filter(function(i){return S.dn.has(i);}).length, tot=m.idx.length;
    var pct=Math.round(done/tot*100), complete=(done===tot), started=done>0;
    var col=lvlCol(m.level);
    var status=complete?'Complete 🌟':started?(done+'/'+tot+' lessons'):'Not started';
    if(full){
      var chipBg2=(m.level==='HL')?'rgba(180,83,9,.10)':'rgba(15,118,110,.10)';
      return '<button class="hub-tile '+(m.level==='HL'?'hl':'sl')+'" onclick="openModule(\''+m.key+'\')" style="grid-column:1 / -1;display:flex;align-items:center;gap:22px;text-align:left;cursor:pointer;font-family:inherit;background:#fff;border:1px solid '+TILEBORDER+';border-radius:20px;padding:22px 26px;">'
        +'<div style="width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;background:'+chipBg2+';">'+m.emoji+'</div>'
        +ring(col,pct,96)
        +'<div style="min-width:0;">'
        +'<div style="font-size:30px;font-weight:800;color:'+INK+';line-height:1.2;">'+m.title+'</div>'
        +'<div style="font-size:23px;font-weight:800;color:'+col+';margin-top:7px;">'+m.level+' · '+status+'</div>'
        +'</div></button>';
    }
    var chipBg=(m.level==='HL')?'rgba(180,83,9,.10)':'rgba(15,118,110,.10)';
    return '<button class="hub-tile '+(m.level==='HL'?'hl':'sl')+'" onclick="openModule(\''+m.key+'\')" style="display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;font-family:inherit;background:#fff;border:1px solid '+TILEBORDER+';border-radius:20px;padding:26px 16px 22px;">'
      +'<div style="display:flex;align-items:center;justify-content:center;gap:18px;">'
      +'<div style="width:78px;height:78px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:42px;background:'+chipBg+';">'+m.emoji+'</div>'
      +ring(col,pct,108)
      +'</div>'
      +'<div style="font-size:25px;font-weight:800;color:'+INK+';margin-top:16px;line-height:1.25;">'+m.title+'</div>'
      +'<div style="font-size:22px;font-weight:800;color:'+col+';margin-top:8px;">'+m.level+' · '+status+'</div>'
      +'</button>';
  }

  /* grid tiles: pairs of modules, with any final odd one full-width */
  var tiles='', i;
  for(i=0;i+1<MODULES.length;i+=2){ tiles+=tile(MODULES[i],false)+tile(MODULES[i+1],false); }
  if(i<MODULES.length){ tiles+=tile(MODULES[i],true); }

  var overallPct=Math.round(totalDone/totalLes*100);
  var acct='';
  if(sb&&CLOUD.user){
    acct='<div style="display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-bottom:6px;font-size:19px;color:'+MUT+';">'
      +'<span>👤 '+(CLOUD.user.email||'signed in')+'</span>'
      +'<button onclick="doSignOut()" style="background:none;border:1px solid '+TILEBORDER+';border-radius:10px;font-family:inherit;font-size:18px;font-weight:700;color:'+MUT+';padding:6px 14px;cursor:pointer;">Sign out</button></div>';
  } else if(sb){
    acct='<div style="display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-bottom:6px;font-size:19px;color:'+MUT+';">'
      +'<span>Playing as guest — progress saved on this device only</span>'
      +'<button onclick="gLogin()" style="background:none;border:1px solid #0f766e;border-radius:10px;font-family:inherit;font-size:18px;font-weight:700;color:#0f766e;padding:6px 14px;cursor:pointer;">Sign in</button></div>';
  }
  document.getElementById('sc-hub').innerHTML=
    '<div style="padding-top:8px;padding-bottom:34px;">'
    +acct
    +'<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">'
    +'<div>'
    +'<div style="font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.11em;color:#b8860b;margin-bottom:6px;">IB DP Economics</div>'
    +'<div style="font-size:46px;font-weight:800;color:'+INK+';line-height:1.12;">Microeconomics</div>'
    +'<div style="font-size:24px;color:'+MUT+';margin-top:6px;">SL + HL · 2022 Syllabus</div>'
    +'</div>'
    +'<div style="display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid '+TILEBORDER+';border-radius:34px;padding:12px 24px;flex-shrink:0;">'
    +'<span style="font-size:28px;">🪙</span><span style="font-size:26px;font-weight:800;color:#8a6d1b;">'+S.silver+'</span>'
    +'</div>'
    +'</div>'
    /* brief instructions */
    +'<div style="background:#fff;border:1px solid '+TILEBORDER+';border-radius:18px;padding:20px 26px;margin:16px 0 10px;">'
    +'<div style="font-size:23px;font-weight:800;color:'+INK+';margin-bottom:8px;">🎯 How it works</div>'
    +'<div style="font-size:21px;color:'+MUT+';line-height:1.55;">'
    +'Pick a module below to open its lessons. Completing a lesson unlocks the next one. '
    +'Answer a pair of lessons perfectly to unlock bonus ⚡ speed rounds — and watch your health: wrong answers cost 25%.'
    +'</div></div>'
    /* legend — makes SL vs HL obvious */
    +'<div style="display:flex;gap:26px;margin:14px 0 6px;">'
    +'<span style="display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:'+MUT+';"><span style="width:20px;height:20px;border-radius:50%;background:'+SLC+';"></span>Standard Level</span>'
    +'<span style="display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:'+MUT+';"><span style="width:20px;height:20px;border-radius:50%;background:'+HLC+';"></span>Higher Level</span>'
    +'</div>'
    /* overall progress */
    +'<div style="margin:16px 0 26px;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
    +'<div style="font-size:22px;color:'+MUT+';font-weight:600;">Overall progress</div>'
    +'<div style="font-size:22px;color:#b8860b;font-weight:800;">'+totalDone+' / '+totalLes+' lessons</div>'
    +'</div>'
    +'<div style="height:13px;background:'+TRACK+';border-radius:99px;overflow:hidden;">'
    +'<div style="height:100%;width:'+overallPct+'%;background:linear-gradient(90deg,'+SLC+','+HLC+');border-radius:99px;transition:width .5s;"></div>'
    +'</div></div>'
    +'<div style="font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:'+MUT+';margin-bottom:18px;">Your progress</div>'
    +'<div class="hub-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">'+tiles+'</div>'
    +'<div style="text-align:center;margin-top:26px;">'
    +'<button onclick="resetProgress()" style="background:none;border:none;color:#a6aec2;font-size:22px;font-family:inherit;cursor:pointer;padding:8px 16px;">↺ Reset all progress</button>'
    +'</div>'
    +'</div>';
}

function goHub(){ sw('hub'); rHub(); if(window.scrollTo)window.scrollTo(0,0); }

function openModule(key){
  sw('home'); rHome();
  function doScroll(){
    var el=document.getElementById('mod-'+key);
    if(!el) return;
    try{ el.scrollIntoView({block:'start'}); }
    catch(e){ window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top+(window.pageYOffset||0)-14)); }
  }
  if(window.requestAnimationFrame){ requestAnimationFrame(function(){ requestAnimationFrame(doScroll); }); }
  else setTimeout(doScroll,60);
}

/* ===================== QUESTION GRAPHS (SVG) ===================== */
/* Optional supporting diagrams. Tag a question with g:'<key>' to show one.
   Diagrams are answer-neutral: they show geometry (points, shapes, the MR
   relationship) without printing the term that is the answer. */
function graphSVG(key){
  function wrap(inner,cap){
    return '<div class="gwrap" style="background:#16243f;border:1.5px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 12px 8px;margin-bottom:18px;">'
      +'<svg viewBox="0 0 360 224" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>'
      +'<div style="text-align:center;font-size:11px;color:#7a90b8;margin-top:4px;">'+cap+'</div></div>';
  }
  /* shared axes for P–Q diagrams */
  var axesPQ='<line x1="48" y1="16" x2="48" y2="196" stroke="#56688f" stroke-width="2"/>'
    +'<line x1="48" y1="196" x2="344" y2="196" stroke="#56688f" stroke-width="2"/>'
    +'<text x="44" y="14" fill="#9fb0d0" font-size="12" font-weight="700" text-anchor="middle">P</text>'
    +'<text x="350" y="200" fill="#9fb0d0" font-size="12" font-weight="700">Q</text>'
    +'<text x="40" y="208" fill="#7a90b8" font-size="10" text-anchor="middle">0</text>';

  if(key==='demandAMB'){
    /* Straight-line demand with points A (top), M (midpoint), B (bottom). Letters only. */
    var s=axesPQ
      +'<line x1="184" y1="112" x2="184" y2="196" stroke="#f5a623" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>'
      +'<line x1="48" y1="112" x2="184" y2="112" stroke="#f5a623" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>'
      +'<line x1="48" y1="32" x2="320" y2="192" stroke="#5b9bff" stroke-width="3.5" stroke-linecap="round"/>'
      +'<circle cx="48" cy="32" r="4.5" fill="#5b9bff"/>'
      +'<circle cx="320" cy="192" r="4.5" fill="#5b9bff"/>'
      +'<circle cx="184" cy="112" r="5.5" fill="#f5a623" stroke="#0e1e36" stroke-width="2"/>'
      +'<text x="58" y="30" fill="#cdd8ee" font-size="14" font-weight="800">A</text>'
      +'<text x="196" y="110" fill="#f5a623" font-size="14" font-weight="800">M</text>'
      +'<text x="212" y="110" fill="#9fadc8" font-size="9.5" font-weight="600">midpoint</text>'
      +'<text x="324" y="186" fill="#cdd8ee" font-size="14" font-weight="800">B</text>';
    return wrap(s,'A straight-line demand curve (D)');
  }

  if(key==='trCurve'){
    /* Total-revenue dome: rises from origin, peaks at the midpoint quantity, falls to zero. */
    var s='<line x1="48" y1="16" x2="48" y2="196" stroke="#56688f" stroke-width="2"/>'
      +'<line x1="48" y1="196" x2="344" y2="196" stroke="#56688f" stroke-width="2"/>'
      +'<text x="40" y="14" fill="#9fb0d0" font-size="11" font-weight="700" text-anchor="end">TR</text>'
      +'<text x="350" y="200" fill="#9fb0d0" font-size="12" font-weight="700">Q</text>'
      +'<text x="40" y="208" fill="#7a90b8" font-size="10" text-anchor="middle">0</text>'
      +'<line x1="184" y1="48" x2="184" y2="196" stroke="#f5a623" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>'
      +'<path d="M48 196 Q184 -100 320 196" fill="none" stroke="#00c4a7" stroke-width="3.2" stroke-linecap="round"/>'
      +'<circle cx="184" cy="48" r="5.5" fill="#f5a623" stroke="#0e1e36" stroke-width="2"/>'
      +'<text x="184" y="40" fill="#f5a623" font-size="11" font-weight="800" text-anchor="middle">TR maximum</text>'
      +'<text x="328" y="190" fill="#6fae9f" font-size="11" font-weight="700">TR</text>';
    return wrap(s,'Total revenue along a straight-line demand curve');
  }

  if(key==='demandMR'){
    /* Demand (D) plus marginal revenue (MR): MR twice as steep, hits axis at half D's quantity. */
    var s=axesPQ
      +'<line x1="184" y1="112" x2="184" y2="196" stroke="#56688f" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>'
      +'<line x1="48" y1="32" x2="320" y2="192" stroke="#5b9bff" stroke-width="3.4" stroke-linecap="round"/>'
      +'<line x1="48" y1="32" x2="184" y2="196" stroke="#c77dff" stroke-width="3.4" stroke-linecap="round"/>'

function rGame(){
  var les=D[S.les],tot=les.qs.length;
  if(S.view==null||S.view>S.qi) S.view=S.qi;
  var vi=S.view, live=(vi===S.qi);
  var q=les.qs[vi];
  /* derive display state: live question uses S.*, past questions use stored answers */
  var subbed=live?S.sub:true;
  var sel=live?S.sel:(S.answers&&S.answers[vi]?S.answers[vi].sel:null);
  var cor=live?S.cor:(S.answers&&S.answers[vi]?S.answers[vi].cor:null);
  var pct=S.qi/tot*100,hc=hpColor(S.hp);
  var hpBar='<div class="hp-wrap"><div class="hp-bar-bg"><div class="hp-bar-fill" style="width:'+S.hp+'%;background:'+hc+';"></div></div><div class="hp-label" style="color:'+hc+';">'+S.hp+'% health</div></div>';

  var qH='';
  var graph=q.g?graphSVG(q.g):'';
  if(q.tp==='mc'||q.tp==='calc'){
    var cb=q.tp==='calc'?'<div class="cbox">'+q.f.map(function(f){return '<div><span style="color:#7a90b8;font-weight:500;">'+f[0]+':</span> <span style="color:#f0b429;font-weight:800;">'+f[1]+'</span></div>';}).join('')+'</div>':'';
    var opts=q.o.map(function(o,i){
      var c='opt';
      if(subbed){if(i===q.a)c+=' ok';else if(i===sel&&!cor)c+=' ng';}
      else if(sel===i)c+=' sel';
      return '<button class="'+c+'" onclick="selA('+i+')" '+(subbed?'disabled':'')+'><span class="olet">'+['A','B','C','D'][i]+'</span><span>'+o+'</span></button>';
    }).join('');
    qH='<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#7a90b8;margin-bottom:9px;">'+q.lb+'</div>'
      +'<div style="font-size:18px;font-weight:700;color:#fff;line-height:1.5;margin-bottom:'+(graph?'12px':'18px')+';">'+q.q+'</div>'+graph+cb+'<div class="opts">'+opts+'</div>';
  }
  if(q.tp==='blank'){
    var sc2=subbed?(cor?'#00c4a7':'#ff5555'):'#f0b429';
    var filled=sel!==null?q.o[sel]:'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
    var slot='<span style="display:inline-block;min-width:140px;border-bottom:3px solid '+sc2+';padding:2px 8px;color:'+sc2+';font-weight:800;text-align:center;border-radius:4px;">'+filled+'</span>';
    var chips=q.o.map(function(o,i){
      var c='chip';
      if(subbed){if(i===q.a)c+=' ok';else if(i===sel&&!cor)c+=' ng';}
      else if(sel===i)c+=' sel';
      return '<button class="'+c+'" onclick="selA('+i+')" '+(subbed?'disabled':'')+'>'+o+'</button>';
    }).join('');
    qH='<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#7a90b8;margin-bottom:9px;">'+q.lb+'</div>'
      +'<div style="font-size:18px;font-weight:700;color:#fff;line-height:1.5;margin-bottom:14px;">'+q.q+'</div>'+graph
      +'<div style="font-size:19px;font-weight:600;color:#fff;line-height:2.4;margin-bottom:18px;">'+q.s.replace('_____',slot)+'</div>'
      +'<div style="display:flex;flex-wrap:wrap;">'+chips+'</div>';
  }

  var fbH='';
  if(subbed){
    var q2=les.qs[vi];
    fbH=cor
      ?'<div class="fb ok"><span style="font-size:22px;">✅</span><div><div style="font-size:14px;font-weight:800;color:#00c4a7;">Correct!'+(live?' <span style="font-size:13px;color:#b0c4de;font-weight:600;">+10 🪙</span>':'')+'</div><div style="font-size:12px;color:#7a90b8;margin-top:2px;">'+(live?'Keep going!':'You answered this correctly.')+'</div></div></div>'
      :'<div class="fb ng" id="fb-ng"><span style="font-size:22px;">❌</span><div><div style="font-size:14px;font-weight:800;color:#ff5555;">Not quite</div><div style="font-size:12px;color:#7a90b8;margin-top:2px;">Correct answer: <strong style="color:#fff;">'+q2.o[q2.a]+'</strong>'+((!live&&sel!=null&&sel!==q2.a)?' · You chose: '+q2.o[sel]:'')+'</div></div></div>';
  }

  var isLast=S.qi===tot-1;
  var bl=!S.sub?'Check':S.hp<=0?'…':isLast?'Finish Lesson →':'Continue →';

    :mod==='hl'
    ?'<span class="mod-label mod-hl" style="font-size:9px;">🎓 HL Demand Elasticity</span>'
    :mod==='hs'
    ?'<span class="mod-label mod-hs" style="font-size:9px;">🎓 HL Elasticity of Supply</span>'
    :mod==='me'
    ?'<span class="mod-label mod-me" style="font-size:9px;">⚖️ Market Equilibrium</span>'
    :mod==='mh'
    ?'<span class="mod-label mod-mh" style="font-size:9px;">📐 HL Surplus Calculations</span>'
    :mod==='gv'

  var primary=live
    ?'<button class="btn gold-btn" onclick="hBtn()" '+bd+' style="flex:1;">'+bl+'</button>'
    :'<button class="btn gold-btn" onclick="goFwd()" style="flex:1;">Forward →</button>';

  document.getElementById('sc-game').innerHTML=
    '<div class="topbar"><button onclick="gH()" style="background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);color:#c0cfe8;font-size:14px;font-weight:800;cursor:pointer;padding:11px 18px;border-radius:11px;font-family:inherit;white-space:nowrap;flex-shrink:0;letter-spacing:.01em;">🗺 Return to Map</button>'
    +'<div class="prog"><div class="pf" style="width:'+pct+'%;"></div></div>'
    +'<div class="coin-pill" style="font-size:11px;padding:5px 10px;">'+coinPillHTML()+'</div></div>'
    +'<div style="margin-bottom:4px;">'+modTag+reviewTag+'</div>'
    +'<div style="margin-bottom:16px;">'+hpBar+'</div>'
    +'<div style="font-size:11px;color:#7a90b8;font-weight:700;margin-bottom:18px;">'+les.t+' · Q'+(vi+1)+'/'+tot+'</div>'
    +qH
    +(live?hintHTML(q):'')
    +fbH
    +'<div style="margin-top:18px;display:flex;gap:10px;align-items:stretch;">'+backBtn+primary+'</div>';
}

function goBack(){var vi=(S.view==null?S.qi:S.view);if(vi>0){S.view=vi-1;rGame();}}
function goFwd(){var vi=(S.view==null?S.qi:S.view);if(vi<S.qi){S.view=vi+1;rGame();}}

function selA(i){if(S.view===S.qi&&!S.sub){S.sel=i;rGame();}}
function hBtn(){if(!S.sub)subA();else nxt();}

function subA(){
  var q=D[S.les].qs[S.qi];
  S.sub=true;S.cor=(S.sel===q.a);
  S.answers[S.qi]={sel:S.sel,cor:S.cor};
  if(S.cor){S.sc++;playCorrect();addSilver(10);popCoin();}
  else{
    playWrong();S.mistake=true;
    S.hp=Math.max(0,S.hp-25);
    if(S.hp<=0){rGame();setTimeout(function(){sw('go');rGO();},1600);return;}
  }
  rGame();
  if(!S.cor){var fb=document.getElementById('fb-ng');if(fb){fb.classList.add('shake');setTimeout(function(){fb.classList.remove('shake');},400);}}
}

function nxt(){
  var les=D[S.les];
  if(S.qi===les.qs.length-1){fin();return;}
  S.qi++;S.view=S.qi;S.sel=null;S.sub=false;S.cor=null;S.hintLevel=0;rGame();
}

function fin(){
  S.dn.add(S.les);
  if(!S.mistake)S.perfect.add(S.les);
  saveProgress();
  var tot=D[S.les].qs.length;
  var pct=Math.round(S.sc/tot*100);
  if(pct>=60){showCelebration(!S.mistake&&S.sc===tot);}
  else{sw('res');rRes();}
}

function gH(){
  sw('home');rHome();
  /* return to where the player was on the map, not the top.
     Defer to the next frame(s) so the freshly-shown map is laid out first. */
  var target=S.les;
  function doScroll(){
    var el=document.getElementById('les-'+target);
    if(!el) return;
    try{
      el.scrollIntoView({block:'center'});
    }catch(e){
      var y=el.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0)-(window.innerHeight/2);
      window.scrollTo(0,Math.max(0,y));
    }
  }
  if(window.requestAnimationFrame){
    requestAnimationFrame(function(){ requestAnimationFrame(doScroll); });
  }else{
    setTimeout(doScroll,60);
  }
}

/* ===================== TRAFFIC LIGHT + F1 ===================== */
function runTrafficLight(onGo){
  var overlay=document.getElementById('tl-overlay');
  var r=document.getElementById('tl-r'),o=document.getElementById('tl-o'),g=document.getElementById('tl-g');
  var goTxt=document.getElementById('tl-go');
  r.classList.remove('on');o.classList.remove('on');g.classList.remove('on');goTxt.classList.remove('show');
  overlay.classList.add('show');
  setTimeout(function(){playBeep(330);r.classList.add('on');},400);
  setTimeout(function(){playBeep(440);r.classList.remove('on');o.classList.add('on');},1300);
  setTimeout(function(){playBeep(880);o.classList.remove('on');g.classList.add('on');goTxt.classList.add('show');fireF1();},2200);
  setTimeout(function(){overlay.classList.remove('show');onGo();},3000);
}
function fireF1(){
  var container=document.getElementById('f1-container'),car=document.getElementById('f1-car'),track=document.getElementById('f1-track');
  track.classList.add('show');container.classList.add('show');
  car.style.animation='none';void car.offsetWidth;
  car.style.animation='f1Drive 1.6s cubic-bezier(.2,.05,.4,1) forwards';
  playGoodLuck();
  setTimeout(function(){container.classList.remove('show');track.classList.remove('show');},2200);
}

/* ===================== SPEED ROUNDS ===================== */
function beginSpeedRound(type){
  S.speedType=type;
  var prior=S.splays[type]||0;
  S.speedReward=(prior>=1)?1:2;   /* first play: 2/correct · 2nd play onwards: 1/correct */
  S.splays[type]=prior+1;
  saveProgress();
  sw('speed');
  document.getElementById('sc-speed').innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:300px;"><div style="text-align:center;color:#7a90b8;font-size:14px;font-weight:600;">Get ready...</div></div>';
  runTrafficLight(function(){startSpeed();});
}

function startSpeed(){
  var pool=getSpeedPool();
  S.sq=shuffle(pool.map(function(_,i){return i;}));
  S.sqIdx=0;S.sanswered=0;S.scorrect=0;S.stimeLeft=60;S.lessilver=0;
  S.scurSub=false;S.sactive=true;S.soptSt={};
  if(S.stimer)clearInterval(S.stimer);
  S.stimer=setInterval(function(){S.stimeLeft--;updateSTimer();if(S.stimeLeft<=0)endSpeed();},1000);
  rSpeed();
}

function getSpeedPool(){
  if(S.speedType==='peds') return PED_SORT_QS;
  if(S.speedType==='pedc') return PED_SPEED_QS;
  if(S.speedType==='pess') return PES_SORT_QS;
  if(S.speedType==='hls') return HL_SORT_QS;
  if(S.speedType==='hlc') return HL_SPEED_QS;
  if(S.speedType==='hss') return HS_SORT_QS;
  if(S.speedType==='hsc') return HS_SPEED_QS;
  if(S.speedType==='mes') return ME_SORT_QS;
  if(S.speedType==='mec') return ME_SPEED_QS;
  if(S.speedType==='mhs') return MH_SORT_QS;
  if(S.speedType==='mhc') return MH_SPEED_QS;
  if(S.speedType==='gvs') return GV_SORT_QS;
  if(S.speedType==='gvc') return GV_SPEED_QS;
  if(S.speedType==='ghs') return GH_SORT_QS;
  if(S.speedType==='ghc') return GH_SPEED_QS;
  return PES_SPEED_QS;
}

function updateSTimer(){
  var el=document.getElementById('timer-num'),ring=document.getElementById('timer-ring');
  if(!el||!ring)return;
  var t=S.stimeLeft,col=t>30?'#00c4a7':t>10?'#f0b429':'#ff5555';
  el.textContent=t;el.style.color=col;
  var c=2*Math.PI*28;
  ring.style.strokeDashoffset=c*(1-t/60);ring.style.stroke=col;
}

function sSel(i,evt){
  if(S.scurSub||!S.sactive)return;
  S.scurSub=true;
  var pool=getSpeedPool();
  var q=pool[S.sq[S.sqIdx]];
  var cor=i===q.a;
  S.sanswered++;
  if(cor){S.scorrect++;addSilver(S.speedReward);playCorrect();}  /* 2 on first play, 1 on replays */
  else{playWrong();}
  var ns={};
  var isSortType=(S.speedType==='peds'||S.speedType==='pess'||S.speedType==='hls'||S.speedType==='hss'||S.speedType==='mes'||S.speedType==='mhs'||S.speedType==='gvs'||S.speedType==='ghs');
  var len=isSortType?(S.speedType==='peds'?PED_DEGREES.length:S.speedType==='hls'?HL_CURVE_DEGREES.length:S.speedType==='hss'?HS_PM_CATS.length:S.speedType==='mes'?ME_SS_CATS.length:S.speedType==='mhs'?MH_SS_CATS.length:S.speedType==='gvs'?GV_CF_CATS.length:S.speedType==='ghs'?GH_TS_CATS.length:PES_DEGREES.length):4;
  for(var j=0;j<len;j++){
    if(j===q.a)ns[j]='ok';
    else if(j===i&&!cor)ns[j]='ng';
  }
  S.soptSt=ns;
  rSpeed();
  if(evt)scoreFlash(cor,evt.clientX-20,evt.clientY-30);
  setTimeout(function(){
    if(!S.sactive)return;
    S.sqIdx++;S.soptSt={};S.scurSub=false;rSpeed();
  },cor?480:880);
}

    +'<div style="background:#152038;border-radius:13px;border:1px solid rgba(255,255,255,.08);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;">'
    +'<div style="font-size:13px;color:#7a90b8;font-weight:600;">Your Coinage</div>'
    +'<div class="coin-pill">'+coinPillHTML()+'</div>'
    +'</div>'
    +'<button class="btn teal-btn" onclick="beginSpeedRound(\''+S.speedType+'\')">Play Again ⚡</button>'
    +'<button class="btn ghost" onclick="gH()">Back to Map</button>';
}

/* ===================== INIT ===================== */
function resetProgress(){
  if(!confirm('Reset all progress and coins? This cannot be undone.'))return;
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  S.dn=new Set();S.perfect=new Set();S.gold=0;S.silver=0;S.splays={};
  rHome();rHub();
}

loadProgress();
rHome();
rHub();
(function boot(){
  if(!sb){ return; }                       /* not configured: guest-only, straight to hub */
  sb.auth.getSession().then(function(r){
    var sess=r&&r.data&&r.data.session;
    if(sess){ CLOUD.user=sess.user; cloudLoadAndEnter(); }
    else { sw('login'); rLogin(); }
  },function(){ /* network issue: stay on hub as guest */ });
})();
</script>
